<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foresight</title>
<style>
:root{--bg:#f7f6f2;--fg:#1d1d1b;--card:#fff;--mut:#777;--line:#e3e2dc;--yes:#16885a;--no:#c0392b;--acc:#2b4a8b}
@media(prefers-color-scheme:dark){:root{--bg:#131312;--fg:#eee;--card:#1d1d1b;--mut:#999;--line:#333;--yes:#3ecf8e;--no:#ef6a62;--acc:#8aa9f0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
header{display:flex;justify-content:space-between;align-items:center}
input,button{font:inherit;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
input{width:100%}
button{cursor:pointer;background:var(--acc);color:#fff;border:0}
button:disabled{opacity:.4;cursor:default}
button.y{background:var(--yes)}button.n{background:var(--no)}
button.g{background:none;color:var(--acc);border:1px solid var(--line)}
.bar{height:10px;border-radius:5px;background:var(--no);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--yes)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.row input{flex:1;min-width:90px;width:auto}
.mut{color:var(--mut);font-size:14px}
label{flex:1;min-width:140px}
#t{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;max-width:90%}
</style></head>
<body><main id="app"></main><div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// 1) Paste your Supabase values (Project Settings > API). The anon key is safe to be public.
const SUPABASE_URL = 'PASTE_PROJECT_URL';
const SUPABASE_KEY = 'PASTE_ANON_KEY';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me, markets = [], P = [], CD = [], T = [], LB = [], STAFF = [], INV = [], PR = [], subscribed = false;

const cost = (a, b, l) => { const m = Math.max(a, b); return m + l * Math.log(Math.exp((a-m)/l) + Math.exp((b-m)/l)); };
const py = m => 1 / (1 + Math.exp((+m.q_no - +m.q_yes) / +m.b));
const worth = (m, p) => {
  const qs = +(p.side === 'yes' ? m.q_yes : m.q_no), qo = +(p.side === 'yes' ? m.q_no : m.q_yes);
  return cost(qs, qo, +m.b) - cost(qs - +p.shares, qo, +m.b);
};
function toast(msg){ const t = $('#t'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3500); }
async function rpc(fn, args){ const {data, error} = await sb.rpc(fn, args); if (error) toast(error.message); await load(); return data; }

function authView(){
  $('#app').innerHTML = `<div class="card"><h2>Foresight</h2>
  <p class="mut">Predict outcomes with play tokens. No real money.</p>
  <input id="u" placeholder="Username (sign up only)"><div class="row"><input id="e" type="email" placeholder="Email"></div>
  <div class="row"><input id="p" type="password" placeholder="Password"></div>
  <div class="row"><button onclick="auth(true)">Log in</button><button class="g" onclick="auth(false)">Sign up</button></div></div>`;
}
async function auth(login){
  const email = $('#e').value, password = $('#p').value;
  const r = login ? await sb.auth.signInWithPassword({email, password})
                  : await sb.auth.signUp({email, password, options:{data:{username:$('#u').value}}});
  if (r.error) return toast(r.error.message);
  if (!r.data.session) return toast('Check your email to confirm, then log in.');
  load();
}

async function load(){
  const {data:{session}} = await sb.auth.getSession();
  if (!session) return authView();
  const [a, b, c, d, e, f, g, h, i] = await Promise.all([
    sb.from('profiles').select().eq('id', session.user.id).single(),
    sb.from('markets').select().order('created_at', {ascending:false}),
    sb.from('positions').select(), sb.from('cooldowns').select(),
    sb.from('trades').select('market_id,price_yes').order('created_at').limit(5000),
    sb.rpc('leaderboard'), sb.from('profiles').select('username,role').neq('role','user'),
    sb.from('invite_codes').select('code,used_by'),
    sb.from('proposals').select('id,question,closes_at,status,note,profiles(username)').order('created_at', {ascending:false}).limit(100)]);
  if (!a.data) return authView();
  me = a.data; markets = b.data || []; P = c.data || []; CD = d.data || [];
  T = e.data || []; LB = f.data || []; STAFF = g.data || []; INV = h.data || []; PR = i.data || [];
  render();
  if (!subscribed){ subscribed = true; sb.channel('m').on('postgres_changes', {event:'*', schema:'public', table:'markets'}, load).on('postgres_changes', {event:'*', schema:'public', table:'proposals'}, load).subscribe(); }
}

function render(){
  const keep = {}; document.querySelectorAll('input[id]').forEach(i => keep[i.id] = i.value);
  const staff = me.role !== 'user';
  let h = `<header><h2>Foresight</h2><div style="text-align:right"><b>${esc(me.username)}</b> · ${(+me.balance).toFixed(1)} tokens<br>
    <a href="#" class="mut" onclick="sb.auth.signOut().then(load);return false">log out</a></div></header>`;

  if (staff) h += queue() + `<div class="card"><b>Create market</b>
    <div class="row"><input id="q" placeholder="Question, e.g. Will it snow on Dec 25?"></div>
    <div class="row"><label class="mut">Opening YES % <input id="o" type="number" value="50"></label><label class="mut">Cooldown (hours) <input id="c" type="number" value="24"></label></div>
    <div class="row"><label class="mut">Closes (optional) <input id="d" type="datetime-local"></label><button onclick="mk()">Create</button></div>
    ${me.role === 'owner' ? ownerPanel() : ''}</div>`;
  else h += suggest() + `<div class="card"><div class="mut">Have an admin invite code?</div>
    <div class="row"><input id="ic" placeholder="Code"><button onclick="rpc('redeem_invite',{p_code:$('#ic').value})">Redeem</button></div></div>`;

  for (const m of markets){
    const y = py(m), open = m.status === 'open', own = m.creator === me.id;
    const cd = CD.find(c => c.market_id === m.id);
    const until = cd ? new Date(cd.last_trade_at).getTime() + m.cooldown_seconds * 1000 : 0;
    const locked = until > Date.now(), closed = m.closes_at && new Date(m.closes_at) <= Date.now();
    h += `<div class="card"><b>${esc(m.question)}</b>${m.proposed_by ? `<div class="mut">Suggested by ${esc(m.proposed_by)}</div>` : ''}<div class="bar"><i style="width:${y*100}%"></i></div>
      <div style="display:flex;justify-content:space-between"><span style="color:var(--yes)">YES ${(y*100).toFixed(0)}%</span><span style="color:var(--no)">NO ${((1-y)*100).toFixed(0)}%</span></div>${chart(m.id)}${m.closes_at && open ? `<p class="mut">Closes ${new Date(m.closes_at).toLocaleString()}</p>` : ''}`;
    for (const p of P.filter(p => p.market_id === m.id)){
      const w = worth(m, p), pc = (w / +p.invested - 1) * 100;
      h += `<div class="row mut">${p.side.toUpperCase()}: invested ${(+p.invested).toFixed(1)} → worth ${w.toFixed(1)} (${pc >= 0 ? '+' : ''}${pc.toFixed(0)}%)
        <button class="g" ${locked || closed || !open ? 'disabled' : ''} onclick="rpc('trade',{p_market:${m.id},p_side:'${p.side}',p_tokens:0,p_action:'sell'})">Cash out</button></div>`;
    }
    if (!open) h += `<p class="mut">${m.outcome === 'void' ? 'Cancelled. Stakes refunded.' : 'Resolved: <b>' + m.outcome.toUpperCase() + '</b>'}</p>`;
    else {
      if (closed) h += `<p class="mut">Trading closed. Waiting for resolution.</p>`;
      else if (own) h += `<p class="mut">You created this market, so you can't trade it.</p>`;
      else if (m.proposer_id === me.id) h += `<p class="mut">You suggested this market, so you can't trade it.</p>`;
      else if (locked) h += `<p class="mut">Locked until ${new Date(until).toLocaleString()}</p>`;
      else h += `<div class="row"><input id="a${m.id}" type="number" min="1" placeholder="Tokens">
        <button class="y" onclick="buy(${m.id},'yes')">Buy YES</button><button class="n" onclick="buy(${m.id},'no')">Buy NO</button></div>`;
      if (own || me.role === 'owner') h += `<div class="row mut">Resolve:
        <button class="g" onclick="res(${m.id},'yes')">YES</button><button class="g" onclick="res(${m.id},'no')">NO</button><button class="g" onclick="res(${m.id},'void')">Void</button></div>`;
    }
    h += `</div>`;
  }
  if (LB.length) h += `<div class="card"><b>Leaderboard</b> <span class="mut">cash + open stakes</span>${LB.map((r, i) =>
    `<div class="row mut" style="justify-content:space-between"><span>${i+1}. ${esc(r.username)}</span><span>${(+r.score).toFixed(1)}</span></div>`).join('')}</div>`;
  $('#app').innerHTML = h;
  for (const k in keep) { const i = document.getElementById(k); if (i) i.value = keep[k]; }
}

const buy = (id, side) => rpc('trade', {p_market:id, p_side:side, p_tokens:+$('#a'+id).value, p_action:'buy'});
const mk = () => rpc('create_market', {p_question:$('#q').value, p_yes:$('#o').value/100, p_cooldown:Math.round($('#c').value*3600),
  p_closes:$('#d').value ? new Date($('#d').value).toISOString() : null});
const suggest = () => `<div class="card"><b>Suggest a market</b><div class="mut">An admin reviews every suggestion before it goes live.</div>
  <div class="row"><input id="sq" placeholder="Will ... happen by ...?"></div>
  <div class="row"><label class="mut">Closes (optional) <input id="sd" type="datetime-local"></label><button onclick="propose()">Submit</button></div>
  ${PR.slice(0, 8).map(p => `<div class="mut" style="margin-top:8px">${esc(p.question)}: <b>${p.status}</b>${p.note ? '<br>Admin comment: ' + esc(p.note) : ''}</div>`).join('')}</div>`;
async function propose(){
  const {error} = await sb.rpc('submit_proposal', {p_question:$('#sq').value, p_closes:$('#sd').value ? new Date($('#sd').value).toISOString() : null});
  if (error) return toast(error.message);
  toast('Submitted for review.'); $('#sq').value = ''; $('#sd').value = ''; load();
}
const queue = () => {
  const pend = PR.filter(p => p.status === 'pending');
  return `<div class="card"><b>Suggestions waiting for review (${pend.length})</b>` + (pend.map(p => `<div style="margin-top:12px">
    <span class="mut">From ${esc(p.profiles ? p.profiles.username : '?')}${p.closes_at ? ' · closes ' + new Date(p.closes_at).toLocaleString() : ''}</span>
    <div class="row"><input id="pq${p.id}" value="${esc(p.question)}"></div>
    <div class="row"><label class="mut">Opening YES % <input id="po${p.id}" type="number" value="50"></label><label class="mut">Cooldown (hours) <input id="pc${p.id}" type="number" value="24"></label></div>
    <div class="row"><input id="pn${p.id}" placeholder="Comment: why approve or reject? (optional, shown to the user)"></div>
    <div class="row"><button class="y" onclick="approve(${p.id})">Approve</button><button class="n" onclick="reject(${p.id})">Reject</button></div></div>`).join('') || '<p class="mut">Nothing to review.</p>') + '</div>';
};
const approve = id => rpc('approve_proposal', {p_id:id, p_question:$('#pq'+id).value, p_yes:$('#po'+id).value/100, p_cooldown:Math.round($('#pc'+id).value*3600), p_note:$('#pn'+id).value});
const reject = id => rpc('reject_proposal', {p_id:id, p_note:$('#pn'+id).value});
const setRole = (u, r) => rpc('set_role', {p_username:u, p_role:r});
function chart(id){
  const pts = T.filter(t => t.market_id === id).map(t => +t.price_yes);
  if (pts.length < 2) return '';
  const W = 300, H = 60, st = W / (pts.length - 1);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + (i*st).toFixed(1) + ' ' + ((1-p)*H).toFixed(1)).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:60px"><path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
const ownerPanel = () => `<hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><b>Owner tools</b>
  <div class="row"><button class="g" onclick="inv()">New admin invite code</button></div>
  <div class="mut" style="margin-top:6px">Unused codes: ${INV.filter(i => !i.used_by).map(i => '<code>' + i.code + '</code>').join(' ') || 'none'}</div>
  <div class="row"><input id="pu" placeholder="Username to make admin"><button onclick="setRole($('#pu').value,'admin')">Make admin</button></div>
  <div class="mut" style="margin-top:6px">Admins: ${STAFF.filter(s => s.role === 'admin').map(s =>
    `${esc(s.username)} <a href="#" data-u="${esc(s.username)}" onclick="setRole(this.dataset.u,'user');return false">remove</a>`).join(', ') || 'none'}</div>`;
const inv = () => rpc('make_invite').then(c => c && prompt('Share this one-time code:', c));
const res = (id, o) => confirm(o === 'void' ? 'Cancel this market and refund everyone\'s stakes? This cannot be undone.' : 'Resolve as ' + o.toUpperCase() + '? This pays out winners and cannot be undone.') && rpc('resolve_market', {p_market:id, p_outcome:o});

load();
</script></body></html>
