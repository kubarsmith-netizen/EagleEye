<html lang="en">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bw:1.5px;--onacc:#fff;--onyn:#fff}
/* ---------- Fall palette (LOCKED, Espresso). Nobody can switch color themes. ---------- */
:root{--bg:#2a1c14;--fg:#f8ebd8;--card:#38281e;--mut:#c4ab92;--line:#4e3724;--bd:#80603f;--yes:#9bc04e;--no:#e8705b;--acc:#f28c28;--side:#2b1e15;--hov:#45341f;--onacc:#2a1204;--onyn:#1a0e05;--stk:drop-shadow(1.5px 0 0 #fffaf0) drop-shadow(-1.5px 0 0 #fffaf0) drop-shadow(0 1.5px 0 #fffaf0) drop-shadow(0 -1.5px 0 #fffaf0) drop-shadow(0 3px 4px #5a2a0a88)}
:root{--grad:linear-gradient(120deg,color-mix(in srgb,var(--acc) 22%,var(--card)),color-mix(in srgb,var(--acc) 5%,var(--card)))}
/* Background pattern lives on a fixed layer, so it stays put while the page scrolls */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
[data-pat=dots] body::before{background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:16px 16px}
[data-pat=grid] body::before{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px}
[data-pat=lines] body::before{background-image:repeating-linear-gradient(45deg,var(--line) 0 1px,transparent 1px 14px)}
[data-pat=leaves] body::before,[data-pat=heavy] body::before{background:none}
#leafbg{display:none;position:fixed;left:0;top:0;z-index:-1;pointer-events:none}
[data-pat=leaves] #leafbg,[data-pat=heavy] #leafbg{display:block}
[data-pat=plaid] body::before{background-image:repeating-linear-gradient(0deg,color-mix(in srgb,var(--acc) 14%,transparent) 0 14px,transparent 14px 40px),repeating-linear-gradient(90deg,color-mix(in srgb,var(--acc) 14%,transparent) 0 14px,transparent 14px 40px),repeating-linear-gradient(0deg,var(--line) 0 2px,transparent 2px 10px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 Fraunces,Georgia,serif;-webkit-font-smoothing:antialiased}
h1{margin:0 0 8px;font-size:25px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;font-weight:700;margin:26px 0 10px}
h1,h2{font-family:Fraunces,Georgia,serif}
#shell{display:flex;min-height:100vh;position:relative;z-index:1}
nav{width:204px;flex-shrink:0;background:var(--side);border-right:var(--bw) solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:1px;font-size:14px;overflow-y:auto}
nav h2{margin:0 10px 14px;font-size:15px;letter-spacing:.02em}
nav h2::before{content:'🦃 ';font-size:1em}
nav a{padding:7px 10px;border-radius:6px;color:var(--mut);text-decoration:none;display:flex;gap:10px;align-items:center;font-weight:500}
nav a svg{flex-shrink:0}
nav a .ni{width:16px;text-align:center;font-size:15px;line-height:1;flex-shrink:0}
nav a .chip{margin-left:auto}
nav a:hover{background:var(--hov);color:var(--fg)}
nav a.on{background:var(--hov);color:var(--fg);font-weight:600}
nav a.on svg{color:var(--acc)}
nav a.me{margin-top:10px;border:var(--bw) solid var(--bd);padding:8px;color:var(--fg);line-height:1.25}
nav a.me::after{content:none!important}
nav a.me:hover,nav a.me.on{border-color:var(--acc)}
.navref{margin-top:auto;padding:10px;border:var(--bw) solid var(--bd);border-radius:12px}
.navref input{margin:4px 0 0;padding:6px 8px;font-size:12px}
.navref button{width:100%;margin-top:6px;padding:6px 8px;font-size:13px}
.navmeter{margin:8px 4px 4px;padding:8px 10px;border:var(--bw) solid var(--bd);border-radius:12px;color:var(--fg);text-decoration:none;display:block;font-size:12px;background:var(--grad)}
.navmeter b{font-size:13px}
.navmeter .meter{height:10px;margin:6px 0 2px}
.navmeter .meter .tgm{font-size:15px}
nav a.me .av{width:30px;height:30px;font-size:16px;margin:0}
nav a.me.bn .mut{color:inherit;opacity:.9}
main{flex:1;padding:30px 38px;min-width:0}
.card{background:var(--card);border:var(--bw) solid var(--bd);border-radius:8px;padding:16px;margin:0 0 16px;position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.grid .card{margin:0}
.two{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:16px 0}
.stats .card{margin:0;border-top:var(--bw) solid var(--acc)}
.mk{color:inherit;text-decoration:none;display:block;padding:22px;border-width:var(--bw);transition:transform .12s,box-shadow .12s,border-color .12s}
.mk:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 22%,transparent)}
.mk b{display:block;font-size:18px;line-height:1.35}
.mk .bar{height:12px;margin:14px 0}
.mk .split{font-size:19px;font-weight:600}
.motw{border-color:var(--acc);background:var(--grad)}
.motw{padding:15px 18px}
.motw b{font-size:19px}
.motw .bar{height:9px;margin:10px 0}
.motw .split{font-size:16px}
.motw .tags .chip{margin-left:6px;vertical-align:middle}
.motw{cursor:pointer}.motw b a{color:inherit;text-decoration:none}
.qt{display:flex;gap:10px;margin-top:14px}.qt button{flex:1;padding:12px;font-size:17px;font-weight:700;letter-spacing:.04em}
.motw .qt{gap:8px;margin-top:10px}.motw .qt button{padding:8px;font-size:15px}
.qt button.y,#qbok.y{background:color-mix(in srgb,var(--yes) 14%,transparent);border:2px solid var(--yes);color:var(--yes)}
.qt button.n,#qbok.n{background:color-mix(in srgb,var(--no) 14%,transparent);border:2px solid var(--no);color:var(--no)}
.qt button.y:hover,#qbok.y:hover{background:color-mix(in srgb,var(--yes) 30%,transparent)}
.qt button.n:hover,#qbok.n:hover{background:color-mix(in srgb,var(--no) 30%,transparent)}
.qb-back{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.qb{width:min(380px,100%);background:var(--card);border:var(--bw) solid var(--acc);border-radius:12px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.qb>b{display:block;font-size:19px}.qb p{margin:12px 0 0}
.narrow{max-width:540px}
.big{font-size:23px;font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--no);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--yes)}
.split{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.mut{color:var(--mut);font-size:13.5px}
a{color:var(--acc)}
.chip{background:var(--hov);color:var(--acc);border:var(--bw) solid var(--bd);border-radius:6px;padding:0 7px;font-size:11px;font-weight:600}
.tags{margin:0 0 10px}
.tag{display:inline-block;padding:2px 10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,#ea580c,#9a3412);border-radius:4px}
input,button,select,textarea{font:inherit;padding:9px 12px;border-radius:6px;border:var(--bw) solid var(--bd);background:var(--bg);color:var(--fg)}
input,textarea{width:100%;margin-top:8px}
textarea{resize:vertical}
input[type=range]{padding:0;accent-color:var(--acc);border:0;background:none}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
label{display:block;flex:1;min-width:140px}
label input{margin-top:4px}
button{cursor:pointer;background:var(--acc);color:var(--onacc);border:var(--bw) solid var(--acc);font-weight:600}
button:disabled{opacity:.4;cursor:default}
button.y{background:var(--yes);border-color:var(--yes);color:var(--onyn)}button.n{background:var(--no);border-color:var(--no);color:var(--onyn)}
button.g{background:none;color:var(--fg);border:var(--bw) solid var(--bd)}
button.g:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
/* turkey button: the special Thanksgiving call-to-action */
button.tk,.btn.tk{background:linear-gradient(135deg,#ffa62e,#e8590c);border-color:#c2410c;color:#fff;text-shadow:0 1px 2px #7c2d1266;box-shadow:0 3px 0 #a3360a}
button.tk:hover:not(:disabled){filter:brightness(1.1);animation:wiggle .5s}
button.tk:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #a3360a}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
.btn{display:inline-block;padding:9px 14px;border-radius:6px;background:var(--acc);color:var(--onacc);cursor:pointer;font-weight:600}
label.up{flex:none;min-width:0}
.clr input{padding:2px;height:38px;cursor:pointer}
.sel{outline:var(--bw) solid var(--acc);outline-offset:1px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:var(--bw) solid var(--line)}
th{color:var(--acc);font-weight:600;font-size:12px;border-bottom:var(--bw) solid var(--bd);text-transform:uppercase;letter-spacing:.04em}
.mine td{font-weight:600;background:var(--hov)}
.search{max-width:420px;margin:6px 0 4px}
.tabs{display:flex;gap:8px;margin:12px 0 18px;align-items:center}
.tabs button,.tabs select{height:40px;padding:0 16px;margin:0}
#t{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--acc);color:var(--onacc);padding:10px 18px;border-radius:8px;display:none;max-width:90%;z-index:60}
.av{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--hov);border:var(--bw) solid var(--bd);font-size:12px;font-weight:600;flex-shrink:0;margin-right:6px;vertical-align:middle;color:var(--fg);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.nm{display:inline-flex;align-items:center;max-width:100%;border-radius:6px;padding:1px 8px 1px 2px;white-space:nowrap}
.nm.bn{padding:2px 10px 2px 3px}
.ic{width:1.9em;height:1.9em;object-fit:contain;vertical-align:middle}
.ice{font-size:1.7em;line-height:1}
.nm .ic,.nm .ice{margin-left:7px}
.prevbn{min-width:230px;padding:8px 14px 8px 8px!important}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px}
.avs button{padding:5px;font-size:18px}
.lk{display:flex;align-items:center;gap:8px;flex:1 1 300px;min-width:0}
.lk b{white-space:nowrap}
.lk input{flex:1 1 120px;max-width:260px;width:auto;min-width:0;margin:0;padding:6px 9px;font-size:13px}
.lk button{padding:6px 11px;white-space:nowrap}
.rc{display:inline-block;background:var(--card);border:var(--bw) solid var(--bd);border-radius:6px;padding:3px 10px;white-space:nowrap}
.ev-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 18px;margin:0 0 16px;border-radius:18px;border:var(--bw) solid #d97706;background:linear-gradient(110deg,#7c2d12,#b45309 55%,#d97706);color:#fff}
.ev-bar a{color:#fff;font-weight:600}
.ev-bar .rc{background:#ffffff22;border-color:#ffffff44;color:#fff}
.ev-bar .blurb{flex:2 1 280px}
.chip.ev{background:#fff;color:#7c2d12;border-color:#fff}
.ev-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rank{display:inline-block;min-width:26px;height:26px;line-height:24px;text-align:center;border-radius:6px;background:var(--hov);border:var(--bw) solid var(--bd);font-weight:600;font-size:12px;color:var(--fg)}
.rank.r1{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
/* Leaderboard rows: the whole row wears the banner */
.lb{display:flex;flex-direction:column;gap:6px}
.lbh,.lbr{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:6px 14px}
.lbh{color:var(--acc);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;border-bottom:var(--bw) solid var(--bd);padding-bottom:8px;margin-bottom:2px}
.lbh span:last-child,.lbr .val{text-align:right}
.lbr{color:inherit;text-decoration:none;cursor:pointer;border:var(--bw) solid var(--line);border-radius:8px;min-height:58px}
.lbr .nm{font-size:16px;font-weight:600;padding:0}
.lbr .av{margin-right:12px}
.lbr .val{font-weight:600}
.lbr:hover{border-color:var(--acc)}
.lbr.mine{outline:var(--bw) solid var(--acc);outline-offset:-1px;background-color:var(--hov)}
.sm .lbh,.sm .lbr{grid-template-columns:34px 1fr auto;padding:5px 10px}
.sm .lbr{min-height:46px}
.sm .lbr .nm{font-size:14px}
#stk{position:fixed;top:26px;right:36px;z-index:8;display:flex;flex-direction:column-reverse;align-items:flex-end;gap:10px}
.stk-btn{display:flex;align-items:center;gap:8px;color:#fff;border:0;border-radius:999px;padding:10px 22px;font-size:22px;line-height:1;font-weight:700;background:linear-gradient(135deg,#fbbf24,#ea580c 55%,#9a3412);box-shadow:0 6px 22px #ea580cbb,inset 0 0 0 var(--bw) #ffffff77;text-shadow:0 1px 3px #4a1d0488}
.stk-btn b{font-size:24px}
.stk-btn:hover{filter:brightness(1.1)}
.stk-btn.off{background:linear-gradient(135deg,#fde68a,#fb923c);box-shadow:0 4px 14px #fb923c88,inset 0 0 0 var(--bw) #ffffff77}
@keyframes stkpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.stk-btn:not(.off){animation:stkpulse 2.6s ease-in-out infinite}
.stk-panel{background:var(--card);border:var(--bw) solid var(--acc);border-radius:8px;padding:14px 16px;width:280px}
.stk-panel p{margin:6px 0 0}
@media(min-width:861px){#rb{margin-right:112px}}
.boardwrap{display:grid;grid-template-columns:7fr 4fr;gap:20px;align-items:start}
.boardwrap>div{min-width:0}
.sm h1{font-size:21px}
@media(max-width:1000px){.boardwrap{grid-template-columns:1fr}}
@media(max-width:860px){#shell{flex-direction:column}nav{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap}nav h2{width:100%}nav a.me{margin-top:0}.navref{margin-top:0;width:100%}.navmeter{width:100%}main{padding:16px}.two,.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}#stk{top:auto;bottom:16px;right:12px}}
/* rounder corners */
.card,.stk-panel{border-radius:18px}
.lbr{border-radius:16px}
input,button,select,textarea,.btn{border-radius:12px}
nav a,.chip,.rc,.rank,.nm{border-radius:12px}
.tag{border-radius:8px}
.bar{border-radius:999px}
#t{border-radius:14px}
/* inventory: earned items you do not hold yet */
.dim{opacity:.6}
/* markets: tabs + search + sort on one row */
.tabs{flex-wrap:wrap}
.tabs .search{flex:0 1 260px;width:auto;min-width:150px;max-width:none;height:40px;margin:0 0 0 auto}
/* leaderboard: both columns share the same rows, so headings, controls and lists line up and match in height */
.boardwrap{grid-template-rows:auto auto auto 1fr;column-gap:20px;row-gap:0;align-items:stretch}
.boardwrap>div{display:grid;grid-template-rows:subgrid;grid-row:span 4}
.boardwrap h1{font-size:25px;margin:0 0 8px}
.boardwrap>div>p{margin:0 0 12px}
.boardwrap .card{margin:0}
.boardwrap .sm .card{align-self:start}
.lbtools{display:flex;align-items:center;gap:8px;height:40px;margin:0 0 12px}
.lbtools .search{flex:1 1 auto;width:auto;max-width:none;height:40px;margin:0}
.lbtools select{height:40px;margin:0;padding:0 12px}
@media(max-width:1000px){.boardwrap,.boardwrap>div{display:block}.boardwrap .card{margin:0 0 16px}}

/* =============== THANKSGIVING EXTRAS =============== */
/* falling leaves + walking turkeys (decorations only) */
#leaves{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#leaves span{position:absolute;top:-8vh;font-size:var(--s,22px);opacity:.6;animation:fall var(--d,18s) linear var(--dl,0s) infinite}
@keyframes fall{0%{transform:translate3d(0,-8vh,0) rotate(0)}50%{transform:translate3d(var(--x,40px),52vh,0) rotate(200deg)}100%{transform:translate3d(calc(var(--x,40px) * -1),112vh,0) rotate(380deg)}}
@keyframes bob{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-5px) rotate(4deg)}}
.tk{display:inline-block;animation:bob .7s ease-in-out infinite alternate;filter:drop-shadow(0 1px 2px #0005)}
.tkbadge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,#ffa62e,#e8590c);border-radius:8px;padding:2px 9px;margin-left:6px;vertical-align:middle}
/* the community meter */
.meter{position:relative;height:28px;border-radius:999px;background:color-mix(in srgb,var(--fg) 14%,var(--card));border:var(--bw) solid var(--bd);margin:14px 0}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#ffe066,#ffc233 45%,#ff9a1f);transition:width .8s}
.meter .mk25,.meter .mk50,.meter .mk75{position:absolute;top:0;bottom:0;width:2px;background:#ffffff66}
.meter .mk25{left:25%}.meter .mk50{left:50%}.meter .mk75{left:75%}
.meter .tgm{position:absolute;top:50%;font-size:28px;transform:translate(-50%,-56%);filter:drop-shadow(0 2px 2px #0006)}
.feast-bar{margin:0 0 16px;padding:18px 22px;border-radius:18px;border:var(--bw) solid #c2410c;background:linear-gradient(110deg,#d9480f,#ee6a14 55%,#f97f1a);color:#fff;position:relative;overflow:hidden}
.feast-bar a{color:#fff;font-weight:700;text-decoration:underline}
.feast-bar .fb-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.feast-bar .fb-top .sp{flex:1}
.feast-bar .meter{height:24px;margin:12px 0 0;background:#7c2d1255;border-color:#ffffff88}
.feast-bar .meter .tgm{font-size:26px}
.feast-bar .fb-top b{font-size:17px}
.feast-bar .fb-msg{margin-top:8px;font-size:14px}
.feast-bar .fb-ev{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:12px;padding-top:12px;border-top:1px solid #ffffff55}
.feast-bar .fb-ev .ev-txt{flex:1 1 260px;min-width:0;font-size:14.5px}
.feast-bar .fb-ev .ev-txt a{color:#fff;font-weight:700;text-decoration:underline}
.feast-bar .fb-ev .links{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.feast-bar a.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 15px;border-radius:999px;background:#fff;color:#7c2d12;text-decoration:none;font-weight:700;font-size:13.5px;box-shadow:0 2px 0 #a3360a;white-space:nowrap}
.feast-bar a.pill:hover{filter:brightness(.96)}
.feast-hero{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 26%,var(--card)),var(--card));border-color:var(--acc)}
.feast-hero .pts{font-size:34px;font-weight:700;font-family:Fraunces,Georgia,serif}
  .feast-fab{display:flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:10px 18px;font-size:18px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,#fbbf24,#ea580c 60%,#c2410c);box-shadow:0 6px 22px #ea580cbb,inset 0 0 0 var(--bw) #ffffff77;text-shadow:0 1px 3px #3b1204aa}
.feast-fab:hover{filter:brightness(1.1)}
.feast-fab .tk{font-size:22px}
.turkey-note{border-color:#d97706;background:linear-gradient(120deg,color-mix(in srgb,#d97706 28%,var(--card)),var(--card))}
.penalty-note{border-color:var(--no);background:linear-gradient(120deg,color-mix(in srgb,var(--no) 24%,var(--card)),var(--card))}
.favor-in{border-color:var(--yes);background:linear-gradient(120deg,color-mix(in srgb,var(--yes) 20%,var(--card)),var(--card))}
.pct-pill{display:inline-block;font-size:30px;font-weight:700;font-family:Fraunces,Georgia,serif;color:var(--acc)}
.tix{display:inline-flex;gap:3px;flex-wrap:wrap}
.minibar{height:10px;border-radius:999px;background:color-mix(in srgb,var(--fg) 14%,var(--card));overflow:hidden;margin:8px 0}

/* the raffle overlay */

function drawLeafBg(heavy){
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);

  let cv = document.getElementById('leafbg');
  if (!cv) { cv = document.createElement('canvas'); cv.id = 'leafbg'; cv.setAttribute('aria-hidden', 'true'); document.body.prepend(cv); }
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  g.fillStyle = heavy ? '#2e160b' : '#5a2a14'; g.fillRect(0, 0, W, H);
  const SHAPES = [
    [new Path2D('M50 2L56 18L64 12L63 30L80 22L75 42L96 42L86 56L92 70L70 68L60 80L53 78L53 98L47 98L47 78L40 80L30 68L8 70L14 56L4 42L25 42L20 22L37 30L36 12L44 18Z'), new Path2D('M50 28V90M50 56L70 40M50 56L30 40')],

// ---------- Pricing: money-share market ----------
const py = m => +m.money_yes / (+m.money_yes + +m.money_no);
const sidePrice = (m, side) => side === 'yes' ? py(m) : 1 - py(m);
const boughtAtPrice = (m, p) => +p.shares > 0 ? +p.invested / +p.shares : sidePrice(m, p.side);
const positionValue = (m, p) => +p.shares * sidePrice(m, p.side);
// what a cash-out actually pays: on the Market of the Week, profit is doubled (losses are not)
const cashValue = (m, p) => { const v = positionValue(m, p), inv = +p.invested; return m.is_motw && v > inv ? inv + 2 * (v - inv) : v; };
const mState = m => m.status !== 'open' ? (m.outcome === 'void' ? 'Cancelled' : 'Resolved: ' + m.outcome.toUpperCase()) : ((m.closes_at && new Date(m.closes_at) <= Date.now()) || Date.now() >= SEASON_END ? 'Trading closed' : 'Open');

// CD holds {market_id, until} where "until" was worked out from the SERVER's clock, so a wrong
// clock on the player's device can no longer keep a cooldown (or a 0-hour cooldown) locked.
function info(m){
  const cd = CD.find(c => c.market_id === m.id);
  const until = cd ? cd.until : 0;
  return {y: py(m), open: m.status === 'open', closed: !!(m.closes_at && new Date(m.closes_at) <= Date.now()) || Date.now() >= SEASON_END, locked: until > Date.now(), until, own: m.creator === me.id, prop: m.proposer_id === me.id};
}

function chart(id){
  const pts = T.filter(t => t.market_id === id).map(t => +t.price_yes);
  if (!LOADED.pts) return '<p class="mut">Loading chart...</p>';
  if (pts.length < 2) return '<p class="mut">The price chart appears after the first trade.</p>';
  const W = 640, H = 270, L = 46, R = 12, TP = 10, B = 44, pw = W - L - R, ph = H - TP - B, n = pts.length;
  const X = i => L + i * pw / (n - 1), Y = p => TP + (1 - p) * ph;
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p).toFixed(1)).join('');
  const grid = [0, .25, .5, .75, 1].map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"${v === .5 ? ' stroke-dasharray="4"' : ''}/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--mut)">${Math.round(v * 100)}%</text>`).join('');
  const xs = [...new Set([0, Math.round((n - 1) / 2), n - 1])].map(i => `<text x="${X(i)}" y="${H - 24}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}" font-size="11" fill="var(--mut)">${i === 0 ? 'Open' : '#' + i}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}<path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2"/>${xs}<text x="${L + pw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--mut)">Trade number (Open = starting odds)</text><text transform="rotate(-90)" x="${-(TP + ph / 2)}" y="12" text-anchor="middle" font-size="11" fill="var(--mut)">YES probability (%)</text></svg>`;
}

async function ensureExtras(){
  if (!me) return;
  const page = (location.hash.slice(2) || 'markets').split('/')[0];
  const keys = new Set(EXTRAS[page] || []);
  ['ev', 'streak', 'co', 'shop', 'special', 'fe'].forEach(k => keys.add(k));
  if (me.role !== 'user') keys.add('pr');
  if (me.role === 'owner') keys.add('ideas');
  const stale = [...keys].filter(k => !AT[k] || Date.now() - AT[k] > TTL[k]);
  if (!stale.length) return;
  const firstLoad = stale.filter(k => !LOADED[k]), prevTurkey = FE ? FE.turkey_market_id : null;
  stale.forEach(k => { AT[k] = Date.now(); });
  await Promise.all(stale.map(async k => {
    const r = await FETCH[k]();
    if (r.error) AT[k] = 0;
    LOADED[k] = true;
  }));
  const cur = (location.hash.slice(2) || 'markets').split('/')[0];
  const quiet = ['ev', 'streak', 'fe'];
  const turkeyMoved = (FE ? FE.turkey_market_id : null) !== prevTurkey;
  if (stale.every(k => quiet.includes(k)) && !firstLoad.includes('fe') && !turkeyMoved && cur === page && page !== 'feast' && page !== 'raffle' && page !== 'favors') {
    const rb = $('#rb'); if (rb) rb.innerHTML = feastBanner();
    const sw = $('#stkw'); if (sw) sw.innerHTML = streakBadge();
    return;
  }
  render();
}

function showRaffle(R, preview){
  const el = $('#rf'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pool = (R.pool || []).map(x => x.username), has = pool.length > 0;
  const names = has ? pool : [];
  const slips = names.length ? Array.from({length: 20}, (_, i) => names[Math.floor(Math.random() * names.length)]) : [];
  const winnerName = R.winner || '';
  const isMe = !preview && R.winner_is_me;
  el.innerHTML = `<div class="rf-back"><div class="rf-confetti" id="rfc"></div><div class="rf-card">
    <div class="rf-title">🦃 The Thanksgiving Raffle 🍁</div>
    <div class="rf-sub" id="rfsub">${has ? 'Stirring the tickets...' : 'Counting the tickets...'}</div>
    <div class="rf-stage" id="rfst"><div class="rf-hand" id="rfh">✋</div><div class="rf-pull" id="rfp">🍁</div>
      <div class="rf-bowl stir" id="rfb">${slips.map((n, i) => `<span class="slip" style="left:${Math.round(Math.random() * 190)}px;top:${Math.round(60 + Math.random() * 100)}px;--r:${Math.round(Math.random() * 90 - 45)}deg;--r2:${Math.round(Math.random() * 180 - 90)}deg;--dx:${Math.round(Math.random() * 60 - 30)}px;--dy:${Math.round(Math.random() * -50)}px;--dl:-${(Math.random() * 1.2).toFixed(2)}s">${esc(n)}</span>`).join('')}</div><div class="rf-rim"></div></div>
    <div class="rf-res" id="rfr"></div>
    <div class="rf-actions"><button class="g" id="rfs">Skip</button><button class="tk" id="rfx" style="display:none">🍂 Close</button></div></div></div>`;
  const q = s => el.querySelector(s), timers = [];
  let done = false;
  const confetti = () => {
    const c = q('#rfc'); if (!c) return;
    const L = ['🍁','🍂','🍃','🦃','🍁','🍂'];
    for (let i = 0; i < 46; i++) {
      const s = document.createElement('span');
      s.textContent = L[i % L.length];
      s.style.cssText = `left:${Math.random() * 100}%;animation-delay:${(Math.random() * 1.6).toFixed(2)}s;animation-duration:${(3 + Math.random() * 3).toFixed(1)}s;font-size:${18 + Math.round(Math.random() * 22)}px;--x:${Math.round(Math.random() * 120 - 60)}px`;
      c.appendChild(s);
    }
  };
  const reveal = () => {
    if (done) return; done = true;
    timers.forEach(clearTimeout);
    const b = q('#rfb'), h = q('#rfh'), pl = q('#rfp'), sub = q('#rfsub'), res = q('#rfr');
    if (!b) return;
    b.classList.remove('stir'); h.classList.remove('dip'); h.classList.add('out');
    if (has && winnerName) {
      pl.textContent = winnerName; pl.classList.add('up', 'win');
      sub.textContent = 'And the winner is...';
      res.innerHTML = isMe ? `🎉 <b>That's YOU, ${esc(winnerName)}!</b> You won <b>${fnum(R.prize)}</b> tokens!` : `🎉 <b>${esc(winnerName)}</b> wins <b>${fnum(R.prize)}</b> tokens!<div class="mut" style="color:#fcd9a8;margin-top:4px">Ticket #${R.ticket} of ${fnum(R.tickets_total)} was drawn.</div>`;
      confetti();
    } else {
      pl.style.display = 'none';
      sub.textContent = 'The bowl is empty...';
      res.innerHTML = 'Nobody earned a turkey ticket this year. Make 10 trades next time to get one!';
    }
    q('#rfs').style.display = 'none'; q('#rfx').style.display = '';
  };
  q('#rfs').onclick = reveal;
  q('#rfx').onclick = () => { el.innerHTML = ''; if (!preview) { rpc('feast_ack_raffle', {}, null); if (FE) FE.show_raffle = false; } };
  if (reduce || !has) { reveal(); return; }
  timers.push(setTimeout(() => { if (done) return; q('#rfsub').textContent = 'Reaching in...'; q('#rfh').classList.add('dip'); }, 2800));
  timers.push(setTimeout(() => { if (done) return; q('#rfb').classList.remove('stir'); q('#rfsub').textContent = 'Pulling out a ticket...'; q('#rfh').classList.remove('dip'); q('#rfh').classList.add('out'); q('#rfp').classList.add('up'); }, 4400));
  timers.push(setTimeout(reveal, 6200));
}

// total that lands in your account on cash-out: payout (2x profit on the Market of the Week)
// + streak bonus + Turkey Market double profit + a waiting Trade Favor - favors you sent (all on the profit only;
// favors only apply to cash-outs worth over 200 tokens)
const cashTotal = (m, p) => {
  const c = cashValue(m, p), prof = Math.max(0, c - (+p.invested)), b = STK ? prof * (+STK.bonus_pct) / 100 : 0;
  const fav = c > 200 ? (favIn() - favOwe()) : 0;
  return c + b + (isTurkey(m) ? prof : 0) + prof * fav / 100;
};
const bonusNote = (m, p) => {
  const bits = [];
  if (isTurkey(m)) bits.push('🦃 Turkey Market 2× profit');
  if (cashValue(m, p) > 200) {
    if (favIn()) bits.push(`🧡 +${favIn().toFixed(1)}% favor you received`);
    if (favOwe()) bits.push(`🧡 −${favOwe().toFixed(1)}% favor you sent`);
  }
  return bits.length ? `<br><span class="mut">Includes ${bits.join(' · ')} (on profit)</span>` : '';
};

function pgMarket(id){
  const m = markets.find(x => x.id === id);
  if (!m) return '<p>Market not found. <a href="#/markets">Back to markets</a></p>';
  const i = info(m), mine = P.filter(p => p.market_id === id && +p.shares > 0);
  let trade;
  if (!i.open) trade = `<p class="mut">${mState(m)}${m.outcome === 'void' ? '. Stakes were refunded.' : ''}</p>`;
  else if (i.closed) trade = `<p class="mut">${Date.now() >= SEASON_END ? 'The season has ended. Trading is closed.' : 'Trading closed. Waiting for resolution.'}</p>`;
  else if (i.locked) trade = `<p class="mut">Locked until ${new Date(i.until).toLocaleString()}</p>`;
  else if (mine.length) trade = `<p class="mut">You already have a position here. Cash out first to trade again.</p>`;
  else trade = `<input id="a${id}" type="number" min="1" placeholder="Tokens to invest">
    <div class="row">${[10, 50, 100].map(n => `<button class="g" onclick="$('#a${id}').value=${n}">${n}</button>`).join('')}</div>
    <div class="row"><button class="y" onclick="buy(${id},'yes')">🦃 Buy YES</button><button class="n" onclick="buy(${id},'no')">🦃 Buy NO</button></div>`;
  const pos = mine.map(p => {
    const v = cashTotal(m, p);
    return `<div class="row split"><span><b>${p.side.toUpperCase()}</b><br>Invested: ${(+p.invested).toFixed(1)}<br>Bought at: ${(boughtAtPrice(m, p) * 100).toFixed(0)}%<br>Now: ${(sidePrice(m, p.side) * 100).toFixed(0)}%<br>You receive: ${v.toFixed(1)}${cashValue(m, p) > +p.invested ? bonusNote(m, p) : ''}</span>

    <button class="g" onclick="res(${id},'yes')">YES won</button><button class="g" onclick="res(${id},'no')">NO won</button><button class="g" onclick="res(${id},'void')">Cancel and refund</button></div></div>` : '';
  const turkeyNote = isTurkey(m) && i.open ? `<div class="card turkey-note"><b>🦃 TURKEY MARKET!</b> Today only, your profit when you <b>cash out</b> on this market is <b>doubled</b>. It was picked at random at the start of the day, and it is the same market for everyone.</div>` : '';
  return `<a href="#/markets" class="mut">← All markets</a><h1>${turkeyIcon(m)}${esc(m.question)}</h1>
  <div class="mut">${mState(m)}${m.is_motw ? ' · <b>Market of the Week</b>: winners earn 2× their profit' : ''}${m.proposed_by ? ' · Suggested by ' + nm(m.proposed_by) : ''}${m.closes_at ? ' · Closes ' + new Date(m.closes_at).toLocaleString() : ''}</div>

    <div class="bar"><i style="width:${i.y*100}%"></i></div>${chart(id)}</div>
  <div><div class="card"><b>Trade</b><div style="margin-top:8px">${trade}</div><p class="mut">Cooldown after each buy: ${+(m.cooldown_seconds / 3600).toFixed(1)} hours</p></div>

// leaderboard rows: sorted by the chosen option, then filtered by the search box (ranks follow the sort)
function boardRows(){
  const mode = LBX ? LBSORT : 'tokens_desc', [key, dir] = mode.split('_'), by = {};
  LB.forEach(r => { by[r.username] = r; });

  rows.sort((a, b) => (dir === 'asc' ? v(a) - v(b) : v(b) - v(a)) || b.score - a.score || a.u.localeCompare(b.u));

const loadImg = url => new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
const toBlob = (c, t, q) => new Promise(r => c.toBlob(r, t, q));
// shrink / convert a chosen image (used by shop uploads and special-item uploads)
async function prepImage(file, fileUrl, kind){
  if (file.type === 'image/gif' && file.size <= 1048576) return {blob: file, ext: 'gif'}; // keeps animation
  const img = await loadImg(fileUrl);
  const max = kind === 'banner' ? 1000 : 128, k = Math.min(1, max / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  const b = kind === 'icon' ? await toBlob(c, 'image/png') : await toBlob(c, 'image/webp', .88);
  const ext = b && {'image/png':'png', 'image/webp':'webp', 'image/jpeg':'jpg'}[b.type];
  if (!ext) throw new Error('encode');
  return {blob: b, ext};
}
const artPath = (kind, ext) => kind + 's/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8).padEnd(6, 'x') + '.' + ext;

function uploadAvatar(inp){
  const f = inp.files[0]; inp.value = '';
  if (!f) return;
  if (!/^image\/(jpeg|png|webp)$/.test(f.type) || f.size > 8e6) return toast('Choose a JPG, PNG or WebP under 8 MB.');
  const url = URL.createObjectURL(f), img = new Image();
  img.onerror = () => toast('Could not read that image.');
  img.onload = () => {
    const s = Math.min(img.width, img.height), c = document.createElement('canvas'), x = c.getContext('2d');
    c.width = c.height = 192;
    x.fillStyle = '#fff'; x.fillRect(0, 0, 192, 192);
    x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 192, 192);
    URL.revokeObjectURL(url);
    c.toBlob(async b => {
      const path = me.id + '/' + Date.now() + '.jpg', old = me.avatar_path;
      const up = await sb.storage.from('avatars').upload(path, b, {contentType:'image/jpeg'});
      if (up.error) return toast(/bucket not found/i.test(up.error.message) ? 'The latest SQL update has not been applied to this Supabase project yet. Run update.sql in the SQL Editor of the project your site uses.' : up.error.message);
      await rpc('set_avatar_path', {p_path:path}, 'Picture updated');
      if (old) sb.storage.from('avatars').remove([old]);
    }, 'image/jpeg', .86);
  };
  img.src = url;
}

// ---------- Idea Box ----------
function pgIdeas(){
  const own = me.role === 'owner';
  const rows = IDEAS.map(x => `<tr><td>${esc(x.body)}</td>${own ? `<td>${x.profiles ? nm(x.profiles.username) : '?'}</td>` : ''}<td>${new Date(x.created_at).toLocaleDateString()}</td><td><span class="chip">${x.status}</span>${own ? `<div class="row">${['planned', 'done', 'declined'].map(s => `<button class="g" onclick="setIdea(${x.id},'${s}')">${s}</button>`).join('')}</div>` : ''}</td></tr>`).join('');
  return `<h1>Idea Box</h1><p class="mut">Got an idea for the website? New features, fixes, shop items, anything. It goes straight to the owner.</p>
  <div class="card narrow"><textarea id="ib" rows="4" maxlength="500" placeholder="I think the site should..."></textarea><div class="row"><button class="tk" onclick="sendIdea()">🍂 Send idea</button><span class="mut">Up to 5 per day</span></div></div>
  <h2>${own ? 'All ideas' : 'Your ideas'}</h2>${IDEAS.length ? `<div class="card"><table><tr><th>Idea</th>${own ? '<th>From</th>' : ''}<th>Sent</th><th>Status</th></tr>${rows}</table></div>` : '<p class="mut">None yet.</p>'}`;
}
async function sendIdea(){
  const {error} = await sb.rpc('submit_idea', {p_body:$('#ib').value});
  if (error) return toast(error.message);
  toast('Sent to the owner. Thanks!');
  $('#ib').value = ''; AT.ideas = 0; ensureExtras();
}
const setIdea = (id, s) => rpc('set_idea_status', {p_id:id, p_status:s});

// ---------- Streak badge ----------
const toggleStk = () => { STK_OPEN = !STK_OPEN; render(); };
const feastFab = () => FE ? `<a class="feast-fab" href="#/feast" title="Thanksgiving Feast: ${Math.floor(feastPct())}% full"><span class="tk">🦃</span><span>${Math.floor(feastPct())}%</span></a>` : '';
function streakBadge(){
  if (!STK) return FE ? `<div id="stk">${feastFab()}</div>` : '';
  const n = +STK.streak, t = +STK.today_trades, g = +STK.goal, pct = +STK.bonus_pct;
  const need = Math.max(0, g - t);
  const status = need === 0 ? 'Today\'s goal is done. Your streak is safe.'
    : (n > 0 ? `Make ${need} more trade${need === 1 ? '' : 's'} today to keep your streak.` : `Make ${need} more trade${need === 1 ? '' : 's'} today to start a streak.`);
  const panel = STK_OPEN ? `<div class="stk-panel"><b>Daily streak</b>
    <p>Streak: <b>${n}</b> day${n === 1 ? '' : 's'}</p><p>Trades today: <b>${t} / ${g}</b></p><p>Cash-out bonus: <b>${pct.toFixed(1)}%</b> of profit</p>
    <p class="mut">${status}</p><p class="mut">+0.1% per streak day, max 10%. Missing a day resets it. Days run midnight to midnight Pacific.</p></div>` : '';
  return `<div id="stk">${panel}${feastFab()}<button class="stk-btn${n ? '' : ' off'}" onclick="toggleStk()" aria-label="Streak details" title="Daily trading streak">🔥 <b>${n}</b></button></div>`;
}

// ---------- shell + router ----------
function render(){
  lastRender = Date.now();
  if (RECOVERY) return resetView();
  if (!me) return authView();
  const keep = {};
  document.querySelectorAll('input[id],textarea[id],select[id]').forEach(i => keep[i.id] = i.value);
  const [pg, arg] = (location.hash.slice(2) || 'markets').split('/');
  const staff = me.role !== 'user', owner = me.role === 'owner';
  const pend = PR.filter(p => p.status === 'pending').length;
  const meBn = itemById(me.banner);
  const link = (id, label, badge) => `<a href="#/${id}" class="${id === pg || (id === 'markets' && pg === 'market') || (id === 'leaderboard' && pg === 'user') ? 'on' : ''}">${ico(IC[id])}${label}${badge ? `<span class="chip">${badge}</span>` : ''}</a>`;
  const pages = {markets: pgMarkets, market: () => pgMarket(+arg), portfolio: pgPortfolio, leaderboard: pgBoard, raffle: pgRaffle, feast: pgFeast, raffle: pgRaffle, favors: pgFavors, user: () => pgUser(decodeURIComponent(arg || '')), shop: pgShop, ideas: pgIdeas, rules: pgRules, suggest: pgSuggest, create: pgCreate, review: pgReview, admin: pgAdmin, account: pgAccount, inventory: pgInventory};
  const ok = {create: staff, review: staff, admin: owner, suggest: !staff};
  const waiting = BLOCKING[pg] && (EXTRAS[pg] || []).some(k => !LOADED[k]);
  const body = !pages[pg] ? '<p>Page not found.</p>' : (pg in ok && !ok[pg]) ? '<p class="mut">You do not have access to this page.</p>' : waiting ? '<p class="mut">Loading...</p>' : pages[pg]();

  $('#app').innerHTML = `<div id="shell"><nav><h2>EagleEye Market</h2>
    ${link('feast', 'Thanksgiving Feast')}${link('raffle', 'Turkey Raffle', myTix() ? myTix() : '')}${link('favors', 'Trade Favors', FE && FE.favor_in ? '1' : '')}${link('markets', 'Markets')}${link('portfolio', 'Portfolio')}${link('leaderboard', 'Leaderboard')}${link('shop', 'Shop')}${link('ideas', 'Idea Box', ideaNew() || '')}${link('rules', 'Rules')}
    ${staff ? link('create', 'Create market') + link('review', 'Review', pend || '') : link('suggest', 'Suggest a market')}
    ${owner ? link('admin', 'Admin tools') : ''}
    <div class="navref"><span class="mut">Your referral link</span><input readonly value="${esc(refLink())}" onclick="this.select()" aria-label="Your referral link"><button onclick="navigator.clipboard.writeText(refLink());toast('Link copied!')">Copy link</button></div>
    <a href="#/account" class="me${pg === 'account' || pg === 'inventory' ? ' on' : ''}${meBn ? ' bn' : ''}"${meBn ? ` style="${esc(bannerStyle(meBn))}"` : ''}>${avatar(me.username, 30)}<span style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis">${esc(me.username)}</b><span class="mut">${(+me.balance).toFixed(0)} tokens · 🎟️ ${myTix()}</span></span></a>
    </nav><main>${PAGE_STICKERS}<div id="rb">${feastBanner(pg === 'feast')}</div>${body}</main></div><div id="stkw">${streakBadge()}</div>`;

  for (const k in keep) { const el = document.getElementById(k); if (el) el.value = keep[k]; }
  if (pg === 'admin') { showShopPreview(); showSpecialPreview(); }
  if (pg === 'market' && staff && !MTok[+arg]) fetchTrades(+arg);
  if (pg === 'user' && arg && !UPtok[decodeURIComponent(arg)]) fetchUser(decodeURIComponent(arg));
  // the raffle has rolled: show the drawing once, the next time this player loads the site
  if (RAFFLE_PENDING && FE && FE.raffle) { RAFFLE_PENDING = false; showRaffle(FE.raffle, false); }
  // a Trade Favor someone sent you: one short pop-up the next time you open the site (once per favor), not a permanent banner
  if (FE && FE.active && FE.favor_in && String(FE.favor_in.id) !== FAV_SHOWN) {
    let seen = null; try { seen = localStorage.getItem('favSeen'); } catch (e) {}
    FAV_SHOWN = String(FE.favor_in.id);
    if (FAV_SHOWN !== seen) {
      try { localStorage.setItem('favSeen', FAV_SHOWN); } catch (e) {}
      toast('🧡 ' + FE.favor_in.from + ' sent you a favor! +' + (+FE.favor_in.pct).toFixed(1) + '% on your next profitable cash-out over 200 tokens.');
    }
  }
}

addEventListener('hashchange', () => { UPtok = {}; render(); scrollTo(0, 0); ensureExtras(); });

const tradesCard = id => {
  if (me.role === 'user') return '';
  const rows = MT[id];
  const body = !rows ? '<p class="mut">Loading...</p>' : !rows.length ? '<p class="mut">No trades yet.</p>' :
    `<table><tr><th>Time</th><th>User</th><th>Action</th><th>Tokens</th><th>YES price after</th></tr>${rows.map(r =>
      `<tr><td>${new Date(r.ts).toLocaleString()}</td><td>${r.username ? nm(r.username) : 'deleted user'}</td><td>${r.kind === 'buy' ? 'Bought' : 'Cashed out'} ${r.side.toUpperCase()}</td><td>${(+r.tokens).toFixed(1)}</td><td>${(+r.price_yes * 100).toFixed(0)}%</td></tr>`).join('')}</table>`;
  return `<div class="card" style="margin-top:18px"><b>All trades on this market</b> <span class="mut">(admins only)</span>${body}</div>`;
};

const toLocalInput = iso => { const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };

const adminBox = m => me.role === 'user' ? '' : `<div class="card"><b>Admin controls</b>
  ${m.status === 'open' ? `<div class="row"><button class="g" onclick="promote(${m.id},${!m.promoted_at})">${m.promoted_at ? 'Remove promotion' : 'Promote to top of Markets page'}</button>
  <button class="g" onclick="boost(${m.id},${!m.boosted_at})">${m.boosted_at ? 'Remove untagged promotion' : 'Promote without a tag'}</button>
  <button class="g" onclick="setMotw(${m.id},${!m.is_motw})">${m.is_motw ? 'Remove Market of the Week' : 'Make Market of the Week'}</button></div>
  <label class="mut" style="margin-top:12px">Close time<input id="cl${m.id}" type="datetime-local" value="${m.closes_at ? toLocalInput(m.closes_at) : ''}"></label>
  <div class="row"><button class="g" onclick="setClose(${m.id})">Save close time</button><button class="g" onclick="clearClose(${m.id})">No close time</button></div>
  <label class="mut" style="margin-top:12px">Cooldown (hours)<input id="ck${m.id}" type="number" min="0" step="0.5" value="${+(m.cooldown_seconds / 3600).toFixed(2)}"></label>
  <div class="row"><button class="g" onclick="setCooldown(${m.id})">Save cooldown</button></div>` : '<p class="mut">Controls are available while a market is open.</p>'}</div>`;

const promote = (id, on) => rpc('promote_market', {p_market:id, p_on:on});
const setMotw = (id, on) => rpc('set_motw', {p_market:id, p_on:on});
const setCooldown = id => {
  const h = parseFloat($('#ck'+id).value);
  if (!(h >= 0)) return toast('Enter the cooldown in hours.');
  rpc('set_cooldown', {p_market:id, p_seconds:Math.round(h * 3600)});
};
const boost = (id, on) => rpc('boost_market', {p_market:id, p_on:on});
const setClose = id => {
  const v = $('#cl'+id).value;
  if (!v) return toast('Pick a date and time, or use "No close time".');
  rpc('set_close_date', {p_market:id, p_closes:new Date(v).toISOString()});
};
const clearClose = id => { $('#cl'+id).value = ''; rpc('set_close_date', {p_market:id, p_closes:null}); };

async function fetchTrades(id){
  MTok[id] = true;
  const {data, error} = await sb.rpc('market_trades', {p_market:id});
  if (error) toast(error.message);
  MT[id] = data || [];
  render();
}

// ---------- actions ----------
const buy = (id, side) => +$('#a'+id).value >= 10 ? rpc('trade', {p_market:id, p_side:side, p_tokens:+$('#a'+id).value, p_action:'buy'}) : toast('Minimum bet is 10 tokens.');
const sell = (id, side) => rpc('trade', {p_market:id, p_side:side, p_tokens:0, p_action:'sell'});

// ---------- Quick bet pop-up (Market of the Week card) ----------
let qbKey = null;
function closeQuickBet(){
  const d = $('#qb'); if (d) d.remove();
  if (qbKey) { document.removeEventListener('keydown', qbKey); qbKey = null; }
}
function quickBet(ev, id, side){
  ev.stopPropagation(); ev.preventDefault();
  const m = markets.find(x => x.id === id); if (!m) return;
  const i = info(m);
  if (!i.open || i.closed) return toast('Trading is closed on this market.');
  if (i.locked) return toast('Locked until ' + new Date(i.until).toLocaleString());
  if (P.some(p => p.market_id === id && +p.shares > 0)) return toast('You already have a position here. Cash out first to trade again.');
  closeQuickBet();
  const S = side.toUpperCase(), d = document.createElement('div');
  d.id = 'qb'; d.className = 'qb-back';
  d.innerHTML = `<div class="qb" role="dialog" aria-modal="true" aria-labelledby="qbt">
    <b id="qbt">How much would you like to bet?</b>
    <div class="mut" style="margin-top:4px"><b style="color:var(--${side})">${S}</b> · ${esc(m.question)}</div>
    <input id="qba" type="number" min="10" step="1" inputmode="numeric" placeholder="Tokens (minimum 10)" autocomplete="off">
    <div class="row">${[10, 50, 100].map(n => `<button class="g" data-n="${n}">${n}</button>`).join('')}</div>
    <p class="mut">You have ${(+me.balance).toFixed(1)} tokens.</p>
    <div class="row"><button class="${side === 'yes' ? 'y' : 'n'}" id="qbok">Bet ${S}</button><button class="g" id="qbx">Cancel</button></div></div>`;
  document.body.appendChild(d);
  const inp = $('#qba');
  d.addEventListener('click', e => { if (e.target === d) closeQuickBet(); });
  d.querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => { inp.value = b.dataset.n; inp.focus(); }));
  $('#qbx').addEventListener('click', closeQuickBet);
  const submit = async () => {
    const n = +inp.value;
    if (!(n >= 10)) return toast('Minimum bet is 10 tokens.');
    closeQuickBet();
    await rpc('trade', {p_market:id, p_side:side, p_tokens:n, p_action:'buy'}, 'Bet placed: ' + n + ' tokens on ' + S);
  };
  $('#qbok').addEventListener('click', submit);
  qbKey = e => { if (e.key === 'Escape') closeQuickBet(); else if (e.key === 'Enter' && document.activeElement === inp) submit(); };
  document.addEventListener('keydown', qbKey);
  inp.focus();
}

async function mk(){
  const adm = me.role === 'admin';   // an admin's market goes to the other admins for approval instead of going live
  const id = await rpc('create_market', {p_question:$('#q').value, p_yes:$('#o').value/100, p_cooldown:Math.round($('#c').value*3600), p_closes:$('#d').value ? new Date($('#d').value).toISOString() : null}, adm ? 'Submitted! Another admin or the owner has to approve your market before it goes live.' : null);
  if (id) { toast('Market created'); go('market/' + id); }
}

async function propose(){
  const h = parseFloat($('#sc').value);
  const {error} = await sb.rpc('submit_proposal', {p_question:$('#sq').value, p_closes:$('#sd').value ? new Date($('#sd').value).toISOString() : null, p_cooldown:h >= 0 ? Math.round(h * 3600) : null});
  if (error) return toast(error.message);
  toast('Submitted for review');
  $('#sq').value = ''; $('#sd').value = ''; $('#sc').value = '';
  AT.pr = 0;
  load();
}

const approve = id => rpc('approve_proposal', {p_id:id, p_question:$('#pq'+id).value, p_yes:$('#po'+id).value/100, p_cooldown:Math.round($('#pc'+id).value*3600), p_note:$('#pn'+id).value});
const reject = id => rpc('reject_proposal', {p_id:id, p_note:$('#pn'+id).value});
const res = (id, o) => confirm(o === 'void' ? 'Cancel this market and refund everyone\'s stakes? This cannot be undone.' : 'Resolve as ' + o.toUpperCase() + '? This pays out winners and cannot be undone.') && rpc('resolve_market', {p_market:id, p_outcome:o});
const inv = () => rpc('make_invite').then(c => c && prompt('Share this one-time code:', c));
const setRole = (u, r) => rpc('set_role', {p_username:u, p_role:r});
const recordFinal = () => confirm('Record the final standings now? This can only be done once.') && rpc('record_final_standings');
const redeem = () => rpc('redeem_invite', {p_code:$('#ic').value});

async function checkReferralAlerts(){
  if (!me) return;
  const {data} = await sb.rpc('claim_referral_alerts');
  if (data && data.length) {
    toast('New referral! ' + data.map(x => x.username).join(', ') + ' joined with your link! Bonus added!');
    AT.ev = 0;
    load();
  }
}
setInterval(() => { if (!document.hidden) checkReferralAlerts(); }, 30000);

load().then(checkReferralAlerts);
// ---- password reset: expired / already-used link message ----
if (LINK_EXPIRED) { history.replaceState(null, '', location.pathname + location.search); setTimeout(() => toast('That reset link has expired or was already used. Tap Forgot password to get a new one.'), 400); }
</script>
