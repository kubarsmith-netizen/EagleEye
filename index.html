<script>
const SUPABASE_URL = 'https://lumsbvchmibxmvrzqtpt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2FD2bNN5kt9U954xwnfidg_HEZu7b2M';
const ALLOWED_DOMAINS = ['headroyce.org'];
const REFERRAL_BONUS = 100; // keep equal to v_bonus in the award_referral SQL function

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
try { const r = new URLSearchParams(location.search).get('ref'); if (r) localStorage.setItem('ref', r.trim().toLowerCase().slice(0, 16)); } catch (e) {}
const savedRef = () => { try { return localStorage.getItem('ref') || ''; } catch (e) { return ''; } };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root = document.documentElement;
let REV = null, me = null, markets = [], P = [], CD = [], T = [], LB = [], STAFF = [], INV = [], PR = [], FINAL = [], ACT = {}, MT = {}, MTok = {}, FILTER = 'open';
let STK = null, SBD = [], STK_OPEN = false;
let SHOPERR = '', CO = {}, SHOP = [], OWN = [], STAT = null, HIST = [], IDEAS = [];
let SHOPFILE = null, SHOPFILE_URL = '';

const AV = ['🦅','🐺','🦊','🐼','🐯','🦁','🐸','🐙','🦉','🐧','🦄','🐲','🚀','⚡','🌙','🔥','🎯','🎲','🎸','📈','🧠','👾','🎨','🏀'];
const THEMES = {light:'Light', dark:'Dark', slate:'Slate', midnight:'Midnight', custom:'Custom'};
const CK = {bg:'--bg', card:'--card', fg:'--fg', acc:'--acc'};
const AVURL = SUPABASE_URL + '/storage/v1/object/public/avatars/';
const SHOPURL = SUPABASE_URL + '/storage/v1/object/public/shop-art/';
const PATS = {none:'None', dots:'Dots', grid:'Grid', lines:'Lines'};
const IC = {race:'M5 21V4M5 4h11l-2 4 2 4H5', markets:'M3 17l6-6 4 4 8-8M15 7h6v6', portfolio:'M3 8h18v12H3zM8 8V5h8v3', leaderboard:'M6 20V10M12 20V4M18 20v-7', shop:'M5 7h14l-1 13H6zM9 7a3 3 0 016 0', rules:'M6 3h12v18H6zM9 8h6M9 12h6', suggest:'M12 5v14M5 12h14', create:'M12 5v14M5 12h14', review:'M5 12l5 5 9-10', admin:'M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z', ideas:'M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z'};
const svg = d => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;

// shop art: built-in items store CSS/emoji, uploaded items store "img:<path>"
const isImg = x => String(x.art).startsWith('img:');
const imgUrl = x => SHOPURL + x.art.slice(4);
const bannerStyle = x => isImg(x) ? `background:url('${imgUrl(x)}') center/cover no-repeat;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.7)` : x.art;
const iconHtml = (x, s) => isImg(x) ? `<img class="ic" src="${esc(imgUrl(x))}" alt=""${s ? ` style="width:${s}px;height:${s}px"` : ''}>` : `<span class="ice">${esc(x.art)}</span>`;

// avatar + banner + icon + name, wherever a name appears
const avatar = (u, s) => {
  const c = (me && u === me.username) ? me : (CO[u] || {}), st = s ? ` style="width:${s}px;height:${s}px;font-size:${Math.round(s * .55)}px"` : '';
  if (c.avatar_path) return `<span class="av"${st}><img src="${AVURL}${esc(c.avatar_path)}" alt="" onerror="this.remove()"></span>`;
  const i = c.avatar ? +c.avatar.slice(1) : -1;
  return `<span class="av"${st}>${AV[i] || esc(String(u || '?')[0].toUpperCase())}</span>`;
};
// s = avatar size, flat = skip the banner (used on leaderboards, where the whole row is the banner)
const nm = (u, s, flat) => {
  const c = CO[u] || {}, ic = SHOP.find(x => x.id === c.icon), bn = flat ? null : SHOP.find(x => x.id === c.banner);
  return `<span class="nm${bn ? ' bn' : ''}"${bn ? ` style="${esc(bannerStyle(bn))}"` : ''}>${avatar(u, s)}${esc(u)}${ic ? iconHtml(ic) : ''}</span>`;
};
// one leaderboard row; the banner covers the entire row
const lbRow = (i, u, val, s) => {
  const c = CO[u] || {}, bn = SHOP.find(x => x.id === c.banner);
  return `<div class="lbr${me && u === me.username ? ' mine' : ''}"${bn ? ` style="${esc(bannerStyle(bn))}"` : ''}><span class="rank r${i < 3 ? i + 1 : 0}">${i + 1}</span><span>${nm(u, s, true)}</span><span class="val">${val}</span></div>`;
};

const SEASON_END = new Date('2026-12-18T15:20:00-08:00');
function cdText(){
  const ms = SEASON_END - Date.now();
  if (ms <= 0) return 'The season has ended. Trading is closed.';
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return `Season ends ${SEASON_END.toLocaleString([], {dateStyle:'medium', timeStyle:'short'})} · ${d}d ${h}h ${m}m ${s % 60}s left`;
}
let seasonOver = Date.now() >= SEASON_END;
setInterval(() => {
  const e = $('#cd');
  if (e) e.textContent = cdText();
  if (!seasonOver && Date.now() >= SEASON_END) { seasonOver = true; render(); }
}, 1000);

function setTheme(t){
  root.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch (e) {}
}
(() => {
  let t;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  setTheme(THEMES[t] ? t : 'dark');
})();
const toggleTheme = () => { setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'); render(); };
const applyLook = () => {
  if (me.theme && THEMES[me.theme]) setTheme(me.theme);
  for (const k in CK) root.style.removeProperty(CK[k]);
  if (me.theme === 'custom' && me.colors) for (const k in CK) if (/^#[0-9a-f]{6}$/i.test(me.colors[k] || '')) root.style.setProperty(CK[k], me.colors[k]);
  root.dataset.pat = me.pattern || 'none';
};

const go = h => { location.hash = '#/' + h; };
const toast = m => {
  const t = $('#t');
  t.textContent = m;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3500);
};

async function rpc(fn, args, ok){
  const {data, error} = await sb.rpc(fn, args);
  if (error) toast(/schema cache/i.test(error.message) ? 'The latest SQL update has not been applied to this Supabase project yet. Run supabase-fix-all.sql in the SQL Editor of the project your site uses.' : error.message); else if (ok) toast(ok);
  for (const k in AT) AT[k] = 0;
  await load();
  return data;
}

// ---------- Pricing: money-share market ----------
const py = m => +m.money_yes / (+m.money_yes + +m.money_no);
const sidePrice = (m, side) => side === 'yes' ? py(m) : 1 - py(m);
const boughtAtPrice = (m, p) => +p.shares > 0 ? +p.invested / +p.shares : sidePrice(m, p.side);
const positionValue = (m, p) => +p.shares * sidePrice(m, p.side);
const mState = m => m.status !== 'open' ? (m.outcome === 'void' ? 'Cancelled' : 'Resolved: ' + m.outcome.toUpperCase()) : ((m.closes_at && new Date(m.closes_at) <= Date.now()) || Date.now() >= SEASON_END ? 'Trading closed' : 'Open');

function info(m){
  const cd = CD.find(c => c.market_id === m.id);
  const until = cd ? new Date(cd.last_trade_at).getTime() + m.cooldown_seconds * 1000 : 0;
  return {y: py(m), open: m.status === 'open', closed: !!(m.closes_at && new Date(m.closes_at) <= Date.now()) || Date.now() >= SEASON_END, locked: until > Date.now(), until, own: m.creator === me.id, prop: m.proposer_id === me.id};
}

function chart(id){
  const pts = T.filter(t => t.market_id === id).map(t => +t.price_yes);
  if (!LOADED.pts) return '<p class="mut">Loading chart...</p>';
  if (pts.length < 2) return '<p class="mut">The price chart appears after the first trade.</p>';
  const W = 640, H = 270, L = 46, R = 12, TP = 10, B = 44, pw = W - L - R, ph = H - TP - B, n = pts.length;
  const X = i => L + i * pw / (n - 1), Y = p => TP + (1 - p) * ph;
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p).toFixed(1)).join('');
  const grid = [0, .25, .5, .75, 1].map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"${v === .5 ? ' stroke-dasharray="4"' : ''}/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--mut)">${Math.round(v * 100)}%</text>`).join('');
  const xs = [...new Set([0, Math.round((n - 1) / 2), n - 1])].map(i => `<text x="${X(i)}" y="${H - 24}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}" font-size="11" fill="var(--mut)">${i === 0 ? 'Open' : '#' + i}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}<path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2"/>${xs}<text x="${L + pw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--mut)">Trade number (Open = starting odds)</text><text transform="rotate(-90)" x="${-(TP + ph / 2)}" y="12" text-anchor="middle" font-size="11" fill="var(--mut)">YES probability (%)</text></svg>`;
}

// ---------- data ----------
const AT = {}, LOADED = {};
const TTL = {ev:60e3, act:60e3, pts:60e3, lb:30e3, final:300e3, staff:60e3, inv:60e3, pr:60e3, streak:60e3, sboard:60e3, co:60e3, shop:60e3, stats:30e3, hist:30e3, ideas:30e3};
const EXTRAS = {markets:['act'], market:['pts'], leaderboard:['lb','final','sboard'], race:['ev'], admin:['staff','inv','final'], suggest:['pr'], review:['pr'], shop:['shop'], account:['stats','hist','shop'], ideas:['ideas']};
const BLOCKING = {leaderboard:1, race:1, admin:1, suggest:1, review:1, shop:1, account:1, ideas:1};

const FETCH = {
  ev: async () => { const r = await sb.rpc('referral_event_info'); REV = r.data || null; return r; },
  act: async () => { const r = await sb.rpc('market_activity'); ACT = {}; (r.data || []).forEach(x => { ACT[x.market_id] = x.recent; }); return r; },
  pts: async () => { const r = await sb.rpc('price_points'); T = r.data || []; return r; },
  lb: async () => { const r = await sb.rpc('leaderboard'); LB = r.data || []; return r; },
  final: async () => { const r = await sb.from('season_final').select('place,username,score').order('place'); FINAL = r.data || []; return r; },
  staff: async () => { const r = await sb.from('profiles').select('username,role').neq('role','user'); STAFF = r.data || []; return r; },
  inv: async () => { const r = await sb.from('invite_codes').select('code,used_by'); INV = r.data || []; return r; },
  pr: async () => { const r = await sb.from('proposals').select('id,question,closes_at,status,note,cooldown_seconds,profiles(username)').order('created_at', {ascending:false}).limit(100); PR = r.data || []; return r; },
  streak: async () => { const r = await sb.rpc('my_streak'); STK = (r.data && r.data[0]) || null; return r; },
  sboard: async () => { const r = await sb.rpc('streak_board'); SBD = r.data || []; return r; },
  co: async () => { const r = await sb.rpc('cosmetics'); CO = {}; (r.data || []).forEach(x => { CO[x.username] = x; }); return r; },
  shop: async () => {
    const [a, b] = await Promise.all([sb.from('shop_items').select().order('sort'), sb.from('user_items').select('item_id')]);
    SHOPERR = (a.error && a.error.message) || ''; SHOP = a.data || []; OWN = (b.data || []).map(x => x.item_id);
    return a.error ? a : b;
  },
  stats: async () => { const r = await sb.rpc('my_stats'); STAT = (r.data && r.data[0]) || null; return r; },
  hist: async () => { const r = await sb.rpc('my_trades'); HIST = r.data || []; return r; },
  ideas: async () => { const r = await sb.from('site_ideas').select('id,body,status,created_at,profiles(username)').order('created_at', {ascending:false}).limit(200); IDEAS = r.data || []; return r; }
};

// number of unread ideas (only the owner can see everyone's ideas)
const ideaNew = () => me && me.role === 'owner' ? IDEAS.filter(x => x.status === 'new').length : 0;

async function ensureExtras(){
  if (!me) return;
  const page = (location.hash.slice(2) || 'markets').split('/')[0];
  const keys = new Set(EXTRAS[page] || []);
  ['ev', 'streak', 'co', 'shop'].forEach(k => keys.add(k));
  if (me.role !== 'user') keys.add('pr');
  if (me.role === 'owner') keys.add('ideas');
  const stale = [...keys].filter(k => !AT[k] || Date.now() - AT[k] > TTL[k]);
  if (!stale.length) return;
  stale.forEach(k => { AT[k] = Date.now(); });
  await Promise.all(stale.map(async k => {
    const r = await FETCH[k]();
    if (r.error) AT[k] = 0;
    LOADED[k] = true;
  }));
  const cur = (location.hash.slice(2) || 'markets').split('/')[0];
  if (stale.every(k => k === 'ev' || k === 'streak') && cur === page && page !== 'race') {
    const rb = $('#rb'); if (rb) rb.innerHTML = refBanner();
    const sw = $('#stkw'); if (sw) sw.innerHTML = streakBadge();
    return;
  }
  render();
}

function resetCaches(){
  for (const k in AT) delete AT[k];
  for (const k in LOADED) delete LOADED[k];
  STK = null; SBD = []; STK_OPEN = false; CO = {}; SHOP = []; OWN = []; STAT = null; HIST = []; IDEAS = [];
}

async function load(){
  const {data:{session}} = await sb.auth.getSession();
  if (!session) { me = null; resetCaches(); return render(); }
  const [a, b, c, d] = await Promise.all([
    sb.from('profiles').select().eq('id', session.user.id).single(),
    sb.from('markets').select().order('created_at', {ascending:false}),
    sb.from('positions').select().eq('user_id', session.user.id),
    sb.from('cooldowns').select().eq('user_id', session.user.id)
  ]);
  if (!a.data) { me = null; resetCaches(); return render(); }
  me = a.data;
  applyLook();
  markets = b.data || [];
  P = c.data || [];
  CD = d.data || [];
  MTok = {};
  render();
  ensureExtras();
}

const marketSig = ms => JSON.stringify(ms.map(m => [m.id, m.status, m.outcome, m.money_yes, m.money_no, m.promoted_at, m.boosted_at, m.closes_at, m.cooldown_seconds]));
setInterval(async () => {
  if (!me || document.hidden) return;
  const el = document.activeElement;
  if (el && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) return;
  const r = await sb.from('markets').select().order('created_at', {ascending:false});
  if (r.data && marketSig(r.data) !== marketSig(markets)) { markets = r.data; render(); }
  // owner: keep the Idea Box badge fresh
  if (me.role === 'owner') {
    const before = ideaNew();
    const q = await FETCH.ideas();
    if (!q.error) { LOADED.ideas = true; AT.ideas = Date.now(); if (ideaNew() !== before) render(); }
  }
}, 30000);

let SORT = 'featured';
const SORTS = {featured:'Featured', newest:'Newest', oldest:'Oldest', high:'Highest YES %', low:'Lowest YES %', active:'Most active (24h)', closing:'Closing soonest'};
const setSort = v => { SORT = v; render(); };
const setFilter = f => { FILTER = f; render(); };
const TREND_MIN = 30;
const isPromoted = m => m.status === 'open' && !!m.promoted_at;
const trending = m => m.status === 'open' && (ACT[m.id] || 0) >= TREND_MIN;
const isBoosted = m => m.status === 'open' && !!m.boosted_at;
const rank = m => isPromoted(m) ? 0 : trending(m) ? 1 : isBoosted(m) ? 2 : 3;
const tags = m => (isPromoted(m) || trending(m)) ? '<div class="tags"><span class="tag">Trending!</span></div>' : '';

const sorters = {
  featured: (a, b) => rank(a) - rank(b) || (rank(a) === 0 ? new Date(b.promoted_at) - new Date(a.promoted_at) : rank(a) === 1 ? ACT[b.id] - ACT[a.id] : rank(a) === 2 ? new Date(b.boosted_at) - new Date(a.boosted_at) : 0),
  newest: (a, b) => new Date(b.created_at) - new Date(a.created_at),
  oldest: (a, b) => new Date(a.created_at) - new Date(b.created_at),
  high: (a, b) => py(b) - py(a),
  low: (a, b) => py(a) - py(b),
  active: (a, b) => (ACT[b.id] || 0) - (ACT[a.id] || 0),
  closing: (a, b) => (a.closes_at ? new Date(a.closes_at) : Infinity) - (b.closes_at ? new Date(b.closes_at) : Infinity) || 0
};

function pgMarket(id){
  const m = markets.find(x => x.id === id);
  if (!m) return '<p>Market not found. <a href="#/markets">Back to markets</a></p>';
  const i = info(m), mine = P.filter(p => p.market_id === id && +p.shares > 0);

  if (!i.open) trade = `<p class="mut">${mState(m)}${m.outcome === 'void' ? '. Stakes were refunded.' : ''}</p>`;
  else if (i.closed) trade = `<p class="mut">${Date.now() >= SEASON_END ? 'The season has ended. Trading is closed.' : 'Trading closed. Waiting for resolution.'}</p>`;
  else if (i.locked) trade = `<p class="mut">Locked until ${new Date(i.until).toLocaleString()}</p>`;
  else if (mine.length) trade = `<p class="mut">You already have a position here. Cash out first to trade again.</p>`;
  else trade = `<input id="a${id}" type="number" min="1" placeholder="Tokens to invest">

function showShopPreview(){

function pickShopFile(inp){
  const f = inp.files[0]; inp.value = '';
  if (!f) return;
  if (!/^image\/(png|jpeg|webp|gif)$/.test(f.type) || f.size > 10e6) return toast('Choose a PNG, JPG, WebP or GIF under 10 MB.');
  if (SHOPFILE_URL) URL.revokeObjectURL(SHOPFILE_URL);
  SHOPFILE = f; SHOPFILE_URL = URL.createObjectURL(f);

}
const loadImg = url => new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
const toBlob = (c, t, q) => new Promise(r => c.toBlob(r, t, q));
async function prepShopImage(kind){
  if (SHOPFILE.type === 'image/gif' && SHOPFILE.size <= 1048576) return {blob: SHOPFILE, ext: 'gif'}; // keeps animation
  const img = await loadImg(SHOPFILE_URL);
  const max = kind === 'banner' ? 1000 : 128, k = Math.min(1, max / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  const b = kind === 'icon' ? await toBlob(c, 'image/png') : await toBlob(c, 'image/webp', .88);
  const ext = b && {'image/png':'png', 'image/webp':'webp', 'image/jpeg':'jpg'}[b.type];
  if (!ext) throw new Error('encode');
  return {blob: b, ext};
}
async function uploadShopItem(){
  if (!SHOPFILE) return toast('Choose an image first.');
  const kind = $('#sk').value, name = $('#sn').value.trim(), price = +$('#spr').value;
  if (!name) return toast('Give it a name.');
  if (!(price >= 0)) return toast('Enter a price.');
  let p;
  try { p = await prepShopImage(kind); } catch (e) { return toast('Could not read that image.'); }
  if (p.blob.size > 1048576) return toast('That image is still over 1 MB after resizing. Try a smaller one.');
  const path = kind + 's/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8).padEnd(6, 'x') + '.' + p.ext;
  const up = await sb.storage.from('shop-art').upload(path, p.blob, {contentType: p.blob.type});
  if (up.error) return toast(/bucket not found/i.test(up.error.message) ? 'Run supabase-update.sql in the Supabase SQL Editor first.' : up.error.message);
  const {error} = await sb.rpc('add_shop_item', {p_kind:kind, p_name:name, p_price:price, p_path:path});
  if (error) { sb.storage.from('shop-art').remove([path]); return toast(/schema cache/i.test(error.message) ? 'Run supabase-update.sql in the Supabase SQL Editor first.' : error.message); }
  URL.revokeObjectURL(SHOPFILE_URL); SHOPFILE = null; SHOPFILE_URL = '';
  $('#sn').value = '';
  toast('Added to the shop!');
  for (const k in AT) AT[k] = 0;
  await load();
}

function uploadAvatar(inp){
  const f = inp.files[0]; inp.value = '';
  if (!f) return;
  if (!/^image\/(jpeg|png|webp)$/.test(f.type) || f.size > 8e6) return toast('Choose a JPG, PNG or WebP under 8 MB.');
  const url = URL.createObjectURL(f), img = new Image();
  img.onerror = () => toast('Could not read that image.');
  img.onload = () => {
    const s = Math.min(img.width, img.height), c = document.createElement('canvas'), x = c.getContext('2d');
    c.width = c.height = 192;
    x.fillStyle = '#fff'; x.fillRect(0, 0, 192, 192);
    x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 192, 192);
    URL.revokeObjectURL(url);
    c.toBlob(async b => {
      const path = me.id + '/' + Date.now() + '.jpg', old = me.avatar_path;
      const up = await sb.storage.from('avatars').upload(path, b, {contentType:'image/jpeg'});

      await rpc('set_avatar_path', {p_path:path}, 'Picture updated');
      if (old) sb.storage.from('avatars').remove([old]);
    }, 'image/jpeg', .86);
  };
  img.src = url;
}

  <button class="g" onclick="boost(${m.id},${!m.boosted_at})">${m.boosted_at ? 'Remove untagged promotion' : 'Promote without a tag'}</button></div>
  <label class="mut" style="margin-top:12px">Close time<input id="cl${m.id}" type="datetime-local" value="${m.closes_at ? toLocalInput(m.closes_at) : ''}"></label>
  <div class="row"><button class="g" onclick="setClose(${m.id})">Save close time</button><button class="g" onclick="clearClose(${m.id})">No close time</button></div>
  <label class="mut" style="margin-top:12px">Cooldown (hours)<input id="ck${m.id}" type="number" min="0" step="0.5" value="${+(m.cooldown_seconds / 3600).toFixed(2)}"></label>
  <div class="row"><button class="g" onclick="setCooldown(${m.id})">Save cooldown</button></div>` : '<p class="mut">Controls are available while a market is open.</p>'}</div>`;

const promote = (id, on) => rpc('promote_market', {p_market:id, p_on:on});
const setCooldown = id => {
  const h = parseFloat($('#ck'+id).value);
  if (!(h >= 0)) return toast('Enter the cooldown in hours.');
  rpc('set_cooldown', {p_market:id, p_seconds:Math.round(h * 3600)});
};
const boost = (id, on) => rpc('boost_market', {p_market:id, p_on:on});
const setClose = id => {
  const v = $('#cl'+id).value;
  if (!v) return toast('Pick a date and time, or use "No close time".');
  rpc('set_close_date', {p_market:id, p_closes:new Date(v).toISOString()});
};
const clearClose = id => { $('#cl'+id).value = ''; rpc('set_close_date', {p_market:id, p_closes:null}); };

async function fetchTrades(id){
  MTok[id] = true;
  const {data, error} = await sb.rpc('market_trades', {p_market:id});
  if (error) toast(error.message);
  MT[id] = data || [];
  render();
}

// ---------- actions ----------
const buy = (id, side) => +$('#a'+id).value >= 10 ? rpc('trade', {p_market:id, p_side:side, p_tokens:+$('#a'+id).value, p_action:'buy'}) : toast('Minimum bet is 10 tokens.');
const sell = (id, side) => rpc('trade', {p_market:id, p_side:side, p_tokens:0, p_action:'sell'});

async function mk(){
  const id = await rpc('create_market', {p_question:$('#q').value, p_yes:$('#o').value/100, p_cooldown:Math.round($('#c').value*3600), p_closes:$('#d').value ? new Date($('#d').value).toISOString() : null});
  if (id) { toast('Market created'); go('market/' + id); }
}

async function propose(){
  const h = parseFloat($('#sc').value);
  const {error} = await sb.rpc('submit_proposal', {p_question:$('#sq').value, p_closes:$('#sd').value ? new Date($('#sd').value).toISOString() : null, p_cooldown:h >= 0 ? Math.round(h * 3600) : null});
  if (error) return toast(error.message);
  toast('Submitted for review');
  $('#sq').value = ''; $('#sd').value = ''; $('#sc').value = '';
  AT.pr = 0;
  load();
}

const approve = id => rpc('approve_proposal', {p_id:id, p_question:$('#pq'+id).value, p_yes:$('#po'+id).value/100, p_cooldown:Math.round($('#pc'+id).value*3600), p_note:$('#pn'+id).value});
const reject = id => rpc('reject_proposal', {p_id:id, p_note:$('#pn'+id).value});
const res = (id, o) => confirm(o === 'void' ? 'Cancel this market and refund everyone\'s stakes? This cannot be undone.' : 'Resolve as ' + o.toUpperCase() + '? This pays out winners and cannot be undone.') && rpc('resolve_market', {p_market:id, p_outcome:o});
const inv = () => rpc('make_invite').then(c => c && prompt('Share this one-time code:', c));
const setRole = (u, r) => rpc('set_role', {p_username:u, p_role:r});
const recordFinal = () => confirm('Record the final standings now? This can only be done once.') && rpc('record_final_standings');
const redeem = () => rpc('redeem_invite', {p_code:$('#ic').value});

async function checkReferralAlerts(){
  if (!me) return;
  const {data} = await sb.rpc('claim_referral_alerts');
  if (data && data.length) {
    toast('New referral! ' + data.map(x => x.username).join(', ') + ' joined with your link! Bonus added!');
    AT.ev = 0;
    load();
  }
}
setInterval(() => { if (!document.hidden) checkReferralAlerts(); }, 30000);

load().then(checkReferralAlerts);
</script>
</body>
</html>
