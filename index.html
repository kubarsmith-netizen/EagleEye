<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EagleEye Market</title>
<style>
:root,[data-theme=light]{--bg:#f4f3ee;--fg:#1d1d1b;--card:#fff;--mut:#6b6b66;--line:#e0dfd8;--yes:#16885a;--no:#c0392b;--acc:#2b4a8b;--side:#ebeae3}
[data-theme=dark]{--bg:#121211;--fg:#ececea;--card:#1c1c1a;--mut:#9a9a94;--line:#2f2f2c;--yes:#3ecf8e;--no:#ef6a62;--acc:#8aa9f0;--side:#181816}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
h1{margin:0 0 6px;font-size:28px}h2{font-size:19px;margin:28px 0 8px}
#shell{display:flex;min-height:100vh}
nav{width:240px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
nav a{padding:10px 12px;border-radius:8px;color:var(--fg);text-decoration:none;display:flex;justify-content:space-between;align-items:center}
nav a:hover{background:var(--line)}nav a.on{background:var(--acc);color:#fff}
main{flex:1;padding:30px 40px;max-width:1240px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}.grid .card{margin:0}
.two{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:16px 0}.stats b{font-size:24px}
.mk{color:inherit;text-decoration:none;display:block}.mk:hover{border-color:var(--acc)}
.narrow{max-width:560px}.big{font-size:26px;font-weight:600}
.bar{height:10px;border-radius:5px;background:var(--no);overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--yes)}
.split{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.mut{color:var(--mut);font-size:14px}a{color:var(--acc)}
.chip{background:var(--line);color:var(--fg);border-radius:10px;padding:1px 8px;font-size:12px}nav a.on .chip{background:#fff3;color:#fff}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 9px}
.tag{display:inline-block;padding:4px 20px 4px 11px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;line-height:1.3;color:#121211;background:#FFFF00;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 50%,100% 100%,0 100%)}
.tag.promo{background:#FFFF00;color:#121211}
input,button{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
input{width:100%;margin-top:8px}label{display:block;flex:1;min-width:150px}label input{margin-top:4px}
button{cursor:pointer;background:var(--acc);color:#fff;border:0}button:disabled{opacity:.4;cursor:default}
button.y{background:var(--yes)}button.n{background:var(--no)}button.g{background:none;color:var(--fg);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}
.tabs{display:flex;gap:8px;margin:14px 0 18px}
select{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
#t{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;max-width:90%;z-index:9}
@media(max-width:860px){#shell{flex-direction:column}nav{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap}main{padding:16px}.two,.stats{grid-template-columns:1fr}}
</style>
<link rel="icon" href="/favicon.ico">
</head>
<body><div id="app"></div><div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://qwkmyncxomibcpmlguxj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_mwgMhSwlsfRnOtu3h8-hUA_F7xjnxAV';
const ALLOWED_DOMAINS = ['headroyce.org'];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const root = document.documentElement;
let me = null, markets = [], P = [], CD = [], T = [], LB = [], STAFF = [], INV = [], PR = [], FINAL = [], ACT = {}, MT = {}, MTok = {}, FILTER = 'open', subscribed = false;

const SEASON_END = new Date('2026-12-18T15:20:00-08:00');
function cdText(){
  const ms = SEASON_END - Date.now();
  if (ms <= 0) return 'The season has ended. Trading is closed.';
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return `Season ends ${SEASON_END.toLocaleString([], {dateStyle:'medium', timeStyle:'short'})} · ${d}d ${h}h ${m}m ${s % 60}s left`;
}
let seasonOver = Date.now() >= SEASON_END;
setInterval(() => { const e = $('#cd'); if (e) e.textContent = cdText(); if (!seasonOver && Date.now() >= SEASON_END) { seasonOver = true; render(); } }, 1000);
function setTheme(t){ root.dataset.theme = t; try { localStorage.setItem('theme', t); } catch (e) {} }
(() => { let t; try { t = localStorage.getItem('theme'); } catch (e) {} setTheme(t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')); })();
const toggleTheme = () => { setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'); render(); };
const go = h => { location.hash = '#/' + h; };
const toast = m => { const t = $('#t'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3500); };
async function rpc(fn, args){ const {data, error} = await sb.rpc(fn, args); if (error) toast(error.message); await load(); return data; }

// ---------- Money Share Pricing Model ----------
const py = m => {
  const my = +m.money_yes || 500;
  const mn = +m.money_no || 500;
  return my / (my + mn);
};

const sidePrice = (m, side) => side === 'yes' ? py(m) : 1 - py(m);
const positionValue = (m, p) => +p.shares * sidePrice(m, p.side);
const boughtAtPrice = (m, p) => +p.shares > 0 ? (+p.invested / +p.shares) : sidePrice(m, p.side);

const mState = m => m.status !== 'open' ? (m.outcome === 'void' ? 'Cancelled' : 'Resolved: ' + m.outcome.toUpperCase()) : ((m.closes_at && new Date(m.closes_at) <= Date.now()) || Date.now() >= SEASON_END ? 'Trading closed' : 'Open');
function info(m){
  const cd = CD.find(c => c.market_id === m.id);
  const until = cd ? new Date(cd.last_trade_at).getTime() + m.cooldown_seconds * 1000 : 0;
  return {y: py(m), open: m.status === 'open', closed: !!(m.closes_at && new Date(m.closes_at) <= Date.now()) || Date.now() >= SEASON_END, locked: until > Date.now(), until, own: m.creator === me.id, prop: m.proposer_id === me.id};
}
function chart(id){
  const pts = T.filter(t => t.market_id === id).map(t => +t.price_yes);
  if (pts.length < 2) return '<p class="mut">The price chart appears after the first trade.</p>';
  const W = 640, H = 270, L = 46, R = 12, TP = 10, B = 44, pw = W - L - R, ph = H - TP - B, n = pts.length;
  const X = i => L + i * pw / (n - 1), Y = p => TP + (1 - p) * ph;
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p).toFixed(1)).join('');
  const grid = [0, .25, .5, .75, 1].map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"${v === .5 ? ' stroke-dasharray="4"' : ''}/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--mut)">${Math.round(v * 100)}%</text>`).join('');
  const xs = [...new Set([0, Math.round((n - 1) / 2), n - 1])].map(i => `<text x="${X(i)}" y="${H - 24}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}" font-size="11" fill="var(--mut)">${i === 0 ? 'Open' : '#' + i}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}<path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2"/>${xs}<text x="${L + pw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--mut)">Trade number (Open = starting odds)</text><text transform="rotate(-90)" x="${-(TP + ph / 2)}" y="12" text-anchor="middle" font-size="11" fill="var(--mut)">YES probability (%)</text></svg>`;
}

// ---------- auth ----------
function authView(){
  $('#app').innerHTML = `<div style="max-width:420px;margin:12vh auto;padding:16px"><div class="card"><h1>EagleEye Market</h1>
  <p class="mut">Please sign up with your Head-Royce email </p>
  <input id="u" placeholder="Username (sign up only)"><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password">
  <div class="row"><button onclick="auth(true)">Log in</button><button class="g" onclick="auth(false)">Sign up</button><button class="g" onclick="toggleTheme()">${root.dataset.theme === 'dark' ? 'Light mode' : 'Dark mode'}</button></div></div></div>`;
}
async function auth(login){
  const email = $('#e').value, password = $('#p').value;
  if (!login && ALLOWED_DOMAINS.length && !ALLOWED_DOMAINS.includes(email.split('@').pop().toLowerCase())) return toast('Please use your ' + ALLOWED_DOMAINS.join(' or ') + ' email.');
  const r = login ? await sb.auth.signInWithPassword({email, password}) : await sb.auth.signUp({email, password, options:{data:{username:$('#u').value}}});
  if (r.error) return toast(r.error.message);
  if (!r.data.session) return toast('Check your email to confirm, then log in.');
  load();
}

// ---------- data ----------
async function load(){
  const {data:{session}} = await sb.auth.getSession();
  if (!session) { me = null; return render(); }
  const [a, b, c, d, e, f, g, h, i, j, k] = await Promise.all([
    sb.from('profiles').select().eq('id', session.user.id).single(),
    sb.from('markets').select().order('created_at', {ascending:false}),
    sb.from('positions').select(), sb.from('cooldowns').select(),
    sb.rpc('price_points'),
    sb.rpc('leaderboard'), sb.from('profiles').select('username,role').neq('role','user'),
    sb.from('invite_codes').select('code,used_by'),
    sb.from('proposals').select('id,question,closes_at,status,note,profiles(username)').order('created_at', {ascending:false}).limit(100),
    sb.from('season_final').select('place,username,score').order('place'),
    sb.rpc('market_activity')]);
  if (!a.data) { me = null; return render(); }
  me = a.data; markets = b.data || []; P = c.data || []; CD = d.data || [];
  T = e.data || []; LB = f.data || []; STAFF = g.data || []; INV = h.data || []; PR = i.data || []; FINAL = j.data || []; MTok = {}; ACT = {}; (k.data || []).forEach(r => { ACT[r.market_id] = r.recent; });
  render();
  if (!subscribed) { subscribed = true;
    sb.channel('m').on('postgres_changes', {event:'*', schema:'public', table:'markets'}, load)
      .on('postgres_changes', {event:'*', schema:'public', table:'proposals'}, load).subscribe(); }
}

// ---------- pages ----------
let SORT = 'featured';
const SORTS = {featured:'Featured', newest:'Newest', oldest:'Oldest', high:'Highest YES %', low:'Lowest YES %', active:'Most active (24h)', closing:'Closing soonest'};
const setSort = v => { SORT = v; render(); };
const setFilter = f => { FILTER = f; render(); };
const TREND_MIN = 6;
const isPromoted = m => m.status === 'open' && !!m.promoted_at;
const trending = m => m.status === 'open' && (ACT[m.id] || 0) >= TREND_MIN;
const isBoosted = m => m.status === 'open' && !!m.boosted_at;
const rank = m => isPromoted(m) ? 0 : trending(m) ? 1 : isBoosted(m) ? 2 : 3;
const tags = m => { const t = isPromoted(m) ? '<span class="tag promo">Trending!</span>' : trending(m) ? '<span class="tag">Trending!</span>' : ''; return t ? `<div class="tags">${t}</div>` : ''; };
const sorters = {
  featured: (a, b) => rank(a) - rank(b) || (rank(a) === 0 ? new Date(b.promoted_at) - new Date(a.promoted_at) : rank(a) === 1 ? ACT[b.id] - ACT[a.id] : rank(a) === 2 ? new Date(b.boosted_at) - new Date(a.boosted_at) : 0),
  newest: (a, b) => new Date(b.created_at) - new Date(a.created_at),
  oldest: (a, b) => new Date(a.created_at) - new Date(b.created_at),
  high: (a, b) => py(b) - py(a),
  low: (a, b) => py(a) - py(b),
  active: (a, b) => (ACT[b.id] || 0) - (ACT[a.id] || 0),
  closing: (a, b) => (a.closes_at ? new Date(a.closes_at) : Infinity) - (b.closes_at ? new Date(b.closes_at) : Infinity) || 0,
};

function pgMarkets(){
  const list = markets.filter(m => FILTER === 'all' || (FILTER === 'open') === (m.status === 'open'))
    .sort(sorters[SORT]);
  return `<h1>Markets</h1><div class="tabs">${['open','resolved','all'].map(f => `<button class="${FILTER === f ? '' : 'g'}" onclick="setFilter('${f}')">${f[0].toUpperCase() + f.slice(1)}</button>`).join('')}<select style="margin-left:auto" onchange="setSort(this.value)">${Object.entries(SORTS).map(([k, v]) => `<option value="${k}"${SORT === k ? ' selected' : ''}>${v}</option>`).join('')}</select></div>
  <div class="grid">${list.map(m => { const y = py(m), mine = P.some(p => p.market_id === m.id);
    return `<a class="card mk" href="#/market/${m.id}">${tags(m)}<b>${esc(m.question)}</b>${m.proposed_by ? `<div class="mut">Suggested by ${esc(m.proposed_by)}</div>` : ''}
    <div class="bar"><i style="width:${y*100}%"></i></div>
    <div class="split"><span style="color:var(--yes)">YES ${(y*100).toFixed(0)}%</span><span style="color:var(--no)">NO ${((1-y)*100).toFixed(0)}%</span></div>
    <div class="mut" style="margin-top:6px">${mState(m)}${mine ? ' · you have a position' : ''}</div></a>`; }).join('') || '<p class="mut">No markets here yet.</p>'}</div>`;
}

function pgMarket(id){
  const m = markets.find(x => x.id === id);
  if (!m) return '<p>Market not found. <a href="#/markets">Back to markets</a></p>';
  const i = info(m), mine = P.filter(p => p.market_id === id);
  let trade;
  if (!i.open) trade = `<p class="mut">${mState(m)}${m.outcome === 'void' ? '. Stakes were refunded.' : ''}</p>`;
  else if (i.closed) trade = `<p class="mut">${Date.now() >= SEASON_END ? 'The season has ended. Trading is closed.' : 'Trading closed. Waiting for resolution.'}</p>`;
  else if (i.locked) trade = `<p class="mut">Locked until ${new Date(i.until).toLocaleString()}</p>`;
  else trade = `<input id="a${id}" type="number" min="1" placeholder="Tokens to invest">
    <div class="row">${[10, 50, 100, 250].map(n => `<button class="g" onclick="$('#a${id}').value=${n}">${n}</button>`).join('')}</div>
    <div class="row"><button class="y" onclick="buy(${id},'yes')">Buy YES</button><button class="n" onclick="buy(${id},'no')">Buy NO</button></div>`;

  const posRows = mine.map(p => { 
    const curP = sidePrice(m, p.side);
    const avgP = boughtAtPrice(m, p);
    const val = positionValue(m, p);
    return `<tr>
      <td><b>${p.side.toUpperCase()}</b></td>
      <td>${(+p.invested).toFixed(1)}</td>
      <td>${(avgP * 100).toFixed(0)}%</td>
      <td>${(curP * 100).toFixed(0)}%</td>
      <td>${val.toFixed(1)}</td>
      <td><button class="g" ${i.locked || i.closed || !i.open ? 'disabled' : ''} onclick="sell(${id},'${p.side}')">Cash out</button></td>
    </tr>`; 
  }).join('');

  const posTable = posRows ? `<div class="card"><b>Your position</b><table>
    <thead>
      <tr>
        <th>Side</th>
        <th>Amount Invested</th>
        <th>Percentage Invested</th>
        <th>Percentage Now</th>
        <th>Worth Now</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>${posRows}</tbody>
  </table></div>` : '';

  const resolve = i.open && (i.own || me.role === 'owner') ? `<div class="card"><b>Resolve this market</b><div class="row">
    <button class="g" onclick="res(${id},'yes')">YES won</button><button class="g" onclick="res(${id},'no')">NO won</button><button class="g" onclick="res(${id},'void')">Cancel and refund</button></div></div>` : '';

  return `<a href="#/markets" class="mut">← All markets</a><h1>${esc(m.question)}</h1>
  <div class="mut">${mState(m)}${m.proposed_by ? ' · Suggested by ' + esc(m.proposed_by) : ''}${m.closes_at ? ' · Closes ' + new Date(m.closes_at).toLocaleString() : ''}</div>
  <div class="two"><div class="card"><div class="split big"><span style="color:var(--yes)">YES ${(i.y*100).toFixed(0)}%</span><span style="color:var(--no)">NO ${((1-i.y)*100).toFixed(0)}%</span></div>
    <div class="bar"><i style="width:${i.y*100}%"></i></div>${chart(id)}</div>
  <div><div class="card"><b>Trade</b><div style="margin-top:8px">${trade}</div><p class="mut">Cooldown after each trade: ${+(m.cooldown_seconds / 3600).toFixed(1)} hours</p></div>
  ${posTable}${resolve}${adminBox(m)}</div></div>${tradesCard(id)}`;
}

function pgPortfolio(){
  const rows = P.map(p => ({p, m: markets.find(x => x.id === p.market_id)})).filter(r => r.m && r.m.status === 'open');
  let totalInvested = 0, totalValue = 0;
  
  const tr = rows.map(({p, m}) => { 
    const curP = sidePrice(m, p.side);
    const avgP = boughtAtPrice(m, p);
    const val = positionValue(m, p); 
    const i = info(m); 
    
    totalInvested += +p.invested; 
    totalValue += val;

    return `<tr>
      <td><a href="#/market/${m.id}">${esc(m.question)}</a></td>
      <td><b>${p.side.toUpperCase()}</b></td>
      <td>${(+p.invested).toFixed(1)}</td>
      <td>${(avgP * 100).toFixed(0)}%</td>
      <td>${(curP * 100).toFixed(0)}%</td>
      <td>${val.toFixed(1)}</td>
      <td><button class="g" ${i.locked || i.closed ? 'disabled' : ''} onclick="sell(${m.id},'${p.side}')">Cash out</button></td>
    </tr>`; 
  }).join('');

  return `<h1>Portfolio</h1>
  <div class="stats">
    <div class="card"><div class="mut">Cash</div><b>${(+me.balance).toFixed(1)}</b></div>
    <div class="card"><div class="mut">Amount Invested</div><b>${totalInvested.toFixed(1)}</b></div>
    <div class="card"><div class="mut">Worth Now</div><b>${totalValue.toFixed(1)}</b></div>
  </div>
  ${rows.length ? `<div class="card"><table>
    <thead>
      <tr>
        <th>Market</th>
        <th>Side</th>
        <th>Amount Invested</th>
        <th>Percentage Invested</th>
        <th>Percentage Now</th>
        <th>Worth Now</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>${tr}</tbody>
  </table></div>` : '<p class="mut">No open positions yet. Pick a market to start.</p>'}`;
}

const pgBoard = () => `<h1>${FINAL.length ? 'Final standings' : 'Leaderboard'}</h1><p class="mut">${FINAL.length ? 'Recorded when the season ended.' : 'Everyone by cash plus open stakes (at cost).'}</p><div class="card"><table><tr><th>#</th><th>Player</th><th>Tokens</th></tr>
  ${(FINAL.length ? FINAL : LB).map((r, i) => `<tr${r.username === me.username ? ' style="font-weight:600"' : ''}><td>${i+1}</td><td>${esc(r.username)}</td><td>${(+r.score).toFixed(1)}</td></tr>`).join('')}</table></div>`;
const statusRows = (list, who) => list.map(p => `<tr><td>${esc(p.question)}</td>${who ? `<td>${esc(p.profiles ? p.profiles.username : 'deleted user')}</td>` : ''}<td><span class="chip">${p.status}</span></td><td>${p.note ? esc(p.note) : '<span class="mut">none</span>'}</td></tr>`).join('');
const pgRules = () => `<h1>Rules and prize</h1><div class="card" style="max-width:760px">
  <h2 style="margin-top:0">The season</h2><p>The season ends on <b>December 18, 2026 at 3:20 PM Pacific Time</b>. The countdown is at the top of every page. When it reaches zero, trading closes.</p>
  <h2>Your tokens</h2><p>Everyone starts with <b>1,000 tokens</b>. Tokens are free, there is nothing to buy, and they cannot be bought or sold.</p>
  <h2>Trading</h2><p>You can trade on any open market that has already been created. Buy YES or NO with your tokens. The odds move as people buy, so buying early at a low price pays more if you are right. You can cash out a position before the market resolves. Everyone can trade every open market, including markets they created or suggested.</p>
  <p><b>Cooldown:</b> after you buy or sell in a market, you cannot buy or sell in that same market again until its cooldown ends. The length is shown on each market page. This keeps the game about predictions, not playing the odds.</p>
  <h2>Create your own market</h2><p>Use <a href="#/suggest">Suggest a market</a> to submit a question. Every suggestion must be <b>approved by an admin</b> before it goes live, and the admin may leave a comment explaining the decision. Once approved, you can trade it like any other market.</p>
  <h2>The prize</h2><p>The person with the <b>most tokens when the countdown ends</b> wins a <b>cash prize</b>. Tokens are counted as your cash balance plus your open stakes at the amount you staked, the same as the Leaderboard. Final standings are recorded when the season ends.</p>
  <h2>Fair play</h2><p>One account per person. Duplicate accounts or cheating can lead to disqualification.</p></div>`;
const pgSuggest = () => `<h1>Suggest a market</h1><p class="mut">An admin reviews every suggestion before it goes live.</p>
  <div class="card narrow"><input id="sq" placeholder="Will ... happen by ...?"><label class="mut" style="margin-top:10px">Closes (optional)<input id="sd" type="datetime-local"></label>
  <div class="row"><button onclick="propose()">Submit for review</button></div></div>
  <h2>Your suggestions</h2>${PR.length ? `<div class="card"><table><tr><th>Question</th><th>Status</th><th>Admin comment</th></tr>${statusRows(PR)}</table></div>` : '<p class="mut">None yet.</p>'}`;
const pgCreate = () => `<h1>Create market</h1><div class="card narrow"><input id="q" placeholder="Question, e.g. Will it snow on Dec 25?">
  <div class="row"><label class="mut">Opening YES %<input id="o" type="number" value="50"></label><label class="mut">Cooldown (hours)<input id="c" type="number" value="24"></label></div>
  <div class="row"><label class="mut">Closes (optional)<input id="d" type="datetime-local"></label></div><div class="row"><button onclick="mk()">Create market</button></div></div>`;
function pgReview(){
  const pend = PR.filter(p => p.status === 'pending'), done = PR.filter(p => p.status !== 'pending');
  return `<h1>Review suggestions</h1><div class="grid">${pend.map(p => `<div class="card"><span class="mut">From ${esc(p.profiles ? p.profiles.username : '?')}${p.closes_at ? ' · closes ' + new Date(p.closes_at).toLocaleString() : ''}</span>
    <input id="pq${p.id}" value="${esc(p.question)}">
    <div class="row"><label class="mut">Opening YES %<input id="po${p.id}" type="number" value="50"></label><label class="mut">Cooldown (hours)<input id="pc${p.id}" type="number" value="24"></label></div>
    <input id="pn${p.id}" placeholder="Comment: why approve or reject? (optional, shown to the user)">
    <div class="row"><button class="y" onclick="approve(${p.id})">Approve</button><button class="n" onclick="reject(${p.id})">Reject</button></div></div>`).join('') || '<p class="mut">Nothing waiting for review.</p>'}</div>
  ${done.length ? `<h2>Already reviewed</h2><div class="card"><table><tr><th>Question</th><th>Suggested by</th><th>Result</th><th>Comment</th></tr>${statusRows(done, true)}</table></div>` : ''}`;
}
const pgAdmin = () => `<h1>Admin tools</h1><div class="grid"><div class="card"><b>Season</b>${Date.now() >= SEASON_END ? (FINAL.length ? '<p class="mut">Final standings are recorded.</p>' : '<p class="mut">Click right after the season ends, before resolving or voiding any market.</p><button onclick="recordFinal()">Record final standings</button>') : '<p class="mut">Available after the season ends.</p>'}</div><div class="card"><b>Invite codes</b><p class="mut">Send a one-time code. They sign up, then redeem it on their Account page.</p>
  <button onclick="inv()">New admin invite code</button><p class="mut">Unused: ${INV.filter(i => !i.used_by).map(i => '<code>' + i.code + '</code>').join(' ') || 'none'}</p></div>
  <div class="card"><b>Promote by username</b><input id="pu" placeholder="Username"><div class="row"><button onclick="setRole($('#pu').value,'admin')">Make admin</button></div></div>
  <div class="card"><b>Current admins</b><table>${STAFF.filter(s => s.role === 'admin').map(s => `<tr><td>${esc(s.username)}</td><td><button class="g" data-u="${esc(s.username)}" onclick="setRole(this.dataset.u,'user')">Remove</button></td></tr>`).join('') || '<tr><td class="mut">None yet</td></tr>'}</table></div></div>`;
const pgAccount = () => `<h1>Account</h1><div class="card narrow"><b>${esc(me.username)}</b> <span class="chip">${me.role}</span><p class="mut">${(+me.balance).toFixed(1)} tokens</p></div>
  ${me.role === 'user' ? `<div class="card narrow"><b>Have an admin invite code?</b><input id="ic" placeholder="Code"><div class="row"><button onclick="redeem()">Redeem</button></div></div>` : ''}`;

// ---------- shell + router ----------
function render(){
  if (!me) return authView();
  const keep = {}; document.querySelectorAll('input[id]').forEach(i => keep[i.id] = i.value);
  const [pg, arg] = (location.hash.slice(2) || 'markets').split('/');
  const staff = me.role !== 'user', owner = me.role === 'owner';
  const pend = PR.filter(p => p.status === 'pending').length;
  const link = (id, label, badge) => `<a href="#/${id}" class="${id === pg || (id === 'markets' && pg === 'market') ? 'on' : ''}">${label}${badge ? `<span class="chip">${badge}</span>` : ''}</a>`;
  const pages = {markets: pgMarkets, market: () => pgMarket(+arg), portfolio: pgPortfolio, leaderboard: pgBoard, rules: pgRules, suggest: pgSuggest, create: pgCreate, review: pgReview, admin: pgAdmin, account: pgAccount};
  const ok = {create: staff, review: staff, admin: owner, suggest: !staff};
  const body = !pages[pg] ? '<p>Page not found.</p>' : (pg in ok && !ok[pg]) ? '<p class="mut">You do not have access to this page.</p>' : pages[pg]();
  $('#app').innerHTML = `<div id="shell"><nav><h2 style="margin:0 12px 14px">EagleEye Market</h2>
    ${link('markets', 'Markets')}${link('portfolio', 'Portfolio')}${link('leaderboard', 'Leaderboard')}${link('rules', 'Rules and prize')}
    ${staff ? link('create', 'Create market') + link('review', 'Review suggestions', pend || '') : link('suggest', 'Suggest a market')}
    ${owner ? link('admin', 'Admin tools') : ''}${link('account', 'Account')}
    <div class="card" style="margin:auto 0 0"><b>${esc(me.username)}</b> <span class="chip">${me.role}</span><div class="mut">${(+me.balance).toFixed(1)} tokens</div>
    <div class="row"><button class="g" onclick="toggleTheme()">${root.dataset.theme === 'dark' ? 'Light mode' : 'Dark mode'}</button><button class="g" onclick="sb.auth.signOut().then(load)">Log out</button></div></div>
    </nav><main><div class="card split"><b id="cd">${cdText()}</b><a href="#/rules">Rules and prize</a></div>${body}</main></div>`;
  for (const k in keep) { const el = document.getElementById(k); if (el) el.value = keep[k]; }
  if (pg === 'market' && staff && !MTok[+arg]) fetchTrades(+arg);
}
addEventListener('hashchange', () => { render(); scrollTo(0, 0); });

const tradesCard = id => {
  if (me.role === 'user') return '';
  const rows = MT[id];
  const body = !rows ? '<p class="mut">Loading...</p>' : !rows.length ? '<p class="mut">No trades yet.</p>' :
    `<table><tr><th>Time</th><th>User</th><th>Action</th><th>Tokens</th><th>YES price after</th></tr>${rows.map(r =>
      `<tr><td>${new Date(r.ts).toLocaleString()}</td><td>${esc(r.username || 'deleted user')}</td><td>${r.kind === 'buy' ? 'Bought' : 'Cashed out'}${r.side.toUpperCase()}</td><td>${(+r.tokens).toFixed(1)}</td><td>${(+r.price_yes * 100).toFixed(0)}%</td></tr>`).join('')}</table>`;
  return `<div class="card" style="margin-top:20px"><b>All trades on this market</b> <span class="mut">(admins only)</span>${body}</div>`;
};
const toLocalInput = iso => { const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const adminBox = m => me.role === 'user' ? '' : `<div class="card"><b>Admin controls</b>
  ${m.status === 'open' ? `<div class="row"><button class="g" onclick="promote(${m.id},${!m.promoted_at})">${m.promoted_at ? 'Remove promotion' : 'Promote to top of Markets page'}</button>
  <button class="g" onclick="boost(${m.id},${!m.boosted_at})">${m.boosted_at ? 'Remove untagged promotion' : 'Promote without a tag'}</button></div>
  <label class="mut" style="margin-top:12px">Close time<input id="cl${m.id}" type="datetime-local" value="${m.closes_at ? toLocalInput(m.closes_at) : ''}"></label>
  <div class="row"><button class="g" onclick="setClose(${m.id})">Save close time</button><button class="g" onclick="clearClose(${m.id})">No close time</button></div>
  <label class="mut" style="margin-top:12px">Cooldown (hours)<input id="ck${m.id}" type="number" min="0" step="0.5" value="${+(m.cooldown_seconds / 3600).toFixed(2)}"></label>
  <div class="row"><button class="g" onclick="setCooldown(${m.id})">Save cooldown</button></div>` : '<p class="mut">Controls are available while a market is open.</p>'}</div>`;
const promote = (id, on) => rpc('promote_market', {p_market:id, p_on:on});
const setCooldown = id => { const h = parseFloat($('#ck'+id).value); if (!(h >= 0)) return toast('Enter the cooldown in hours.'); rpc('set_cooldown', {p_market:id, p_seconds:Math.round(h * 3600)}); };
const boost = (id, on) => rpc('boost_market', {p_market:id, p_on:on});
const setClose = id => { const v = $('#cl'+id).value; if (!v) return toast('Pick a date and time, or use "No close time".'); rpc('set_close_date', {p_market:id, p_closes:new Date(v).toISOString()}); };
const clearClose = id => { $('#cl'+id).value = ''; rpc('set_close_date', {p_market:id, p_closes:null}); };
async function fetchTrades(id){
  MTok[id] = true;
  const {data, error} = await sb.rpc('market_trades', {p_market:id});
  if (error) toast(error.message);
  MT[id] = data || []; render();
}

// ---------- actions ----------
const buy = (id, side) => rpc('trade', {p_market:id, p_side:side, p_tokens:+$('#a'+id).value, p_action:'buy'});
const sell = (id, side) => rpc('trade', {p_market:id, p_side:side, p_tokens:0, p_action:'sell'});
async function mk(){
  const id = await rpc('create_market', {p_question:$('#q').value, p_yes:$('#o').value/100, p_cooldown:Math.round($('#c').value*3600), p_closes:$('#d').value ? new Date($('#d').value).toISOString() : null});
  if (id) { toast('Market created'); go('market/' + id); }
}
async function propose(){
  const {error} = await sb.rpc('submit_proposal', {p_question:$('#sq').value, p_closes:$('#sd').value ? new Date($('#sd').value).toISOString() : null});
  if (error) return toast(error.message);
  toast('Submitted for review'); $('#sq').value = ''; $('#sd').value = ''; load();
}
const approve = id => rpc('approve_proposal', {p_id:id, p_question:$('#pq'+id).value, p_yes:$('#po'+id).value/100, p_cooldown:Math.round($('#pc'+id).value*3600), p_note:$('#pn'+id).value});
const reject = id => rpc('reject_proposal', {p_id:id, p_note:$('#pn'+id).value});
const res = (id, o) => confirm(o === 'void' ? 'Cancel this market and refund everyone\'s stakes? This cannot be undone.' : 'Resolve as ' + o.toUpperCase() + '? This pays out winners and cannot be undone.') && rpc('resolve_market', {p_market:id, p_outcome:o});
const inv = () => rpc('make_invite').then(c => c && prompt('Share this one-time code:', c));
const setRole = (u, r) => rpc('set_role', {p_username:u, p_role:r});
const recordFinal = () => confirm('Record the final standings now? This can only be done once.') && rpc('record_final_standings');
const redeem = () => rpc('redeem_invite', {p_code:$('#ic').value});

load();
</script></body></html>
